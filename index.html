  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

d-green-text:   #0a7d41;  /* accessible green-on-white */\n  --brand-green-tint:   #005353;\n\n  /* ---------- Semantic / iOS-like accents (Light) ---------- */\n  --c-green:  #34c759;\n  --c-yellow: #ffcc00;\n  --c-red:    #ff3b30;\n  --c-orange: #ff9500;\n  --c-sky:    #48a3f7;\n  --c-blue:   #007aff;\n  --c-pink:   #ff2d55;\n  --c-lilac:  #af52de;\n  --c-rose:   #f36b83;\n  --c-teal:   #21d3f3;\n\n  /* ---------- Warm neutrals (imagery / mast-head fills) ---------- */\n  --c-almond: #FCE7CF;\n  --c-cream:  #FEF3E7;\n\n  /* ---------- Tag palette (Light) ---------- */\n  --tag-green:      #96D9A7;\n  --tag-yellow:     #FFE561;\n  --tag-red:        #FBA5A0;\n  --tag-orange:     #FFBC53;\n  --tag-blue:       #86C2FF;\n  --tag-pink:       #F4AAFB;\n  --tag-purple:     #CAA9FF;\n  --tag-light-blue: #8DDDEB;\n\n  /* Soft course-card tag bg from odin */\n  --tag-soft-green: #d0eabe;\n  --tag-soft-cream: #fefaf1; /* wall of praise bg */\n\n  /* Marketing-specific: used on dark BGs */\n  --marketing-green: #408B6C;\n\n  /* ---------- Radii / shadows / spacing ---------- */\n  --radius-sm: 4px;\n  --radius:    8px;           /* canonical — cards, buttons, inputs */\n  --radius-lg: 12px;\n  --radius-pill: 100px;\n\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);\n  --shadow:    0 2px 8px rgba(0,0,0,0.08);\n  --shadow-lg: 0 10px 40px -10px rgba(0,0,0,0.20);\n  --shadow-glow-green: 0 10px 40px -10px #2af77355;\n\n  /* Content gutters */\n  --gutter-desktop: 64px;\n  --gutter-mobile:  24px;\n  --max-content:    1200px;\n\n  /* ---------- Semantic typography tokens (Default / App-side, desktop) ---------- */\n  --h1-size: 42px;   --h1-lh: 114%; --h1-ls: -3.35px;\n  --h2-size: 35px;   --h2-lh: 120%; --h2-ls: -2.8px;\n  --h3-size: 30px;   --h3-lh: 125%; --h3-ls: -2.5px;\n  --h4-size: 22px;   --h4-lh: 128%; --h4-ls: -2.25px;\n  --h5-size: 19px;   --h5-lh: 145%; --h5-ls: 0.15px;\n  --h6-size: 19px;   --h6-lh: 145%; --h6-ls: 0.15px;\n\n  --body1-size: 17px; --body1-lh: 160%; --body1-ls: (--bg-default);\n  color: var(--fg-primary);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-feature-settings: \"liga\" off;\n  margin: 0;\n}\nh5, h6 { font-family: var(--font-body); font-weight: 400; margin: 0; }\n\nh1 { font-size: var(--h1-size); line-height: var(--h1-lh); letter-spacing: var(--h1-ls); }\nh2 { font-size: var(--h2-size); line-height: var(--h2-lh); letter-spacing: var(--h2-ls); }\nh3 { font-size: var(--h3-size); line-height: var(--h3-lh); letter-spacing: var(--h3-ls); }\nh4 { font-size: var(--h4-size); line-height: var(--h4-lh); letter-spacing: var(--h4-ls); }\nh5 { font-size: var(--h5-size); line-height: var(--h5-lh); letter-spacing: var(--h5-ls); }\nh6 { font-size: var(--h6-size); line-height: var(--h6-lh); letter-spacing: var(--h6-ls); }\n\np, .body1 { font: 400 var(--body1-size)/var(--body1-lh) var(--font-body); letter-spacing: var(--body1-ls); margin: 0; }\n.body2    { font: 400 var(--body2-size)/var(--body2-lh) var(--font-body); letter-spacing: var(--body2-ls); }\n.caption  { font: 400 var(--caption-size)/var(--caption-lh) var(--font-body); }\n.overline { font: 400 var(--overline-size)/var(--overline-lh) var(--font-body); text-transform: uppercase; letter-spacing: 1px; }\n.tag      { font: 400 var(--tag-size)/var(--tag-lh) var(--font-body); }\n\ncode, pre { font-family: var(--font-mono); }\n\n/* Marketing / hero scale — use on landing pages */\n.display-1 { font: 400 72px/100% var(--font-display); letter-spacing: -8.7px; }\n.display-2 { font: 400 54px/100% var(--font-display); letter-spacing: -6.2px; }\n.display-3 { font: 400 40px/100% var(--font-display); letter-spacing: -4px; }\n\n/* Buttons */\n.btn {\n  font: 500 var(--btn-lg-size)/var(--btn-lg-lh) var(--font-body);\n  letter-spacing: var(--btn-lg-ls);\n  padding: 12px 20px;\n  border-radius: var(--radius);\n  cursor: pointer;\n  border: none;\n  display: inline-flex; ali         #ffffff;\n  --bg-card:         #ffffff;\n  --bg-overlay:      rgba(203,203,203,0.80);\n\n  /* ---------- Foreground / Text (Light) ---------- */\n  --fg-primary:    rgba(0,0,0,0.96);\n  --fg-secondary:  rgba(0,0,0,0.75);\n  --fg-tertiary:   rgba(0,0,0,0.60);\n  --fg-disabled:   rgba(0,0,0,0.40);\n  --fg-on-dark:    rgba(255,255,255,1);\n\n  /* ---------- Borders / Dividers ---------- */\n  --border:       #E5E5E5;\n  --separator:    #000000;\n  --divider:      rgba(26,26,26,0.10);\n\n  /* ---------- Brand & CTAs ---------- */\n  --cta-primary-bg:   #21c45b;    /* NextLeap green */\n  --cta-primary-fg:   #ffffff;\n  --cta-secondary-bg: #0c0c0c;    /* Near-black */\n  --cta-secondary-fg: #ffffff;\n\n  --brand-green:        #21c45b;  /* primary */\n  --brand-green-bright: #2af773;  /* dark-mode accent, also \"primary_green\" in light */\n  --brand-green-text:   #0a7d41;  /* accessible green-on-white */\n  --brand-green-tint:   #005353;\n\n  /* ---------- Semantic / iOS-like accents (Light) ---------- */\n  --c-green:  #34c759;\n  --c-yellow: #ffcc00;\n  --c-red:    #ff3b30;\n  --c-orange: #ff9500;\n  --c-sky:    #48a3f7;\n  --c-blue:   #007aff;\n  --c-pink:   #ff2d55;\n  --c-lilac:  #af52de;\n  --c-rose:   #f36b83;\n  --c-teal:   #21d3f3;\n\n  /* ---------- Warm neutrals (imagery / mast-head fills) ---------- */\n  --c-almond: #FCE7CF;\n  --c-cream:  #FEF3E7;\n\n  /* ---------- Tag palette (Light) ---------- */\n  --tag-green:      #96D9A7;\n  --tag-yellow:     #FFE561;\n  --tag-red:        #FBA5A0;\n  --tag-orange:     #FFBC53;\n  --tag-blue:       #86C2FF;\n  --tag-pink:       #F4AAFB;\n  --tag-purple:     #CAA9FF;\n  --tag-light-blue: #8DDDEB;\n\n  /* Soft course-card tag bg from odin */\n  --tag-soft-green: #d0eabe;\n  --tag-soft-cream: #fefaf1; /* wall of praise bg */\n\n  /* Marketing-specific: used on dark BGs */\n  --marketing-green: #408B6C;\n\n  /* ---------- Radii / shadows / spacing ---------- */\n  --radius-sm: 4px;\n  --radius:    8px;           /* canonical — cards, buttons, inputs */\n  --radius-lg: 12px;\n  --radius-pill: 100px;\n\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);\n  --shadow:    0 2px 8px rgba(0,0,0,0.08);\n  --shadow-lg: 0 10px 40px -10px rgba(0,0,0,0.20);\n  --shadow-glow-green: 0 10px 40px -10px #2af77355;\n\n  /* Content gutters */\n  --gutter-desktop: 64px;\n  --gutter-mobile:  24px;\n  --max-content:    1200px;\n\n  /* ---------- Semantic typography tokens (Default / App-side, desktop) ---------- */\n  --h1-size: 42px;   --h1-lh: 114%; --h1-ls: -3.35px;\n  --h2-size: 35px;   --h2-lh: 120%; --h2-ls: -2.8px;\n  --h3-size: 30px;   --h3-lh: 125%; --h3-ls: -2.5px;\n  --h4-size: 22px;   --h4-lh: 128%; --h4-ls: -2.25px;\n  --h5-size: 19px;   --h5-lh: 145%; --h5-ls: 0.15px;\n  --h6-size: 19px;   --h6-lh: 145%; --h6-ls: 0.15px;\n\n  --body1-size: 17px; --body1-lh: 160%; --body1-ls: 0.25px;\n  --body2-size: 15px; --body2-lh: 160%; --body2-ls: 0.25px;\n  --caption-size: 13px; --caption-lh: 150%;\n  --overline-size: 11px; --overline-lh: 100%;\n  --tag-size: 12px; --tag-lh: 110%;\n\n  --btn-lg-size: 17px;  --btn-lg-lh: 118%; --btn-lg-ls: 0.5px;\n  --btn-sm-size: 15px;  --btn-sm-lh: 134%; --btn-sm-ls: 0.25px;\n}\n\n/* ================= Dark theme ==================== */\n[data-theme=\"dark\"], .theme-dark {\n  --bg-default:    #0c0c0c;\n  --bg-primary:    #0c0c0c;\n  --bg-secondary:  #141414;\n  --bg-tertiary:   #1f1f1f;\n  --bg-quaternary: rgba(255,255,255,0.30);\n  --bg-quaternary-light: rgba(255,255,255,0.05);\n  --bg-input:      #2e2e2e;\n  --bg-card:       #1f1f1f;\n  --bg-overlay:    rgba(40,40,40,0.90);\n\n  --fg-primary:    rgba(255,255,255,1);\n  --fg-secondary:  rgba(255,255,255,0.75);\n  --fg-tertiary:   rgba(255,255,255,0.60);\n  --fg-disabled:   rgba(255,255,255,0.40);\n  --fg-on-dark:    rgba(255,255,255,1);\n\n  --border:     rgba(255,255,255,0.10);\n  --separator:  rgba(255,255,255,0.10);\n  --divider:    rgba(255,255,255,0.10);\n\n  --cta-primary-bg:   #2af773;\n  --cta-primary-fg:   rgba(0,0,0,0.96);\n  --cta-secondary-bg: #ffffff;\n  --cta-secondary-fg: rgba(0,0,0,0.96);\n\n  --brand-green-text: #2af773;\n\n  /* iOS-like accents shift for dark */\n  --c-green:  #30d158;\n  --c-yellow: #ffd60a;\n  --c-red:    #ff453a;\n  --c-orange: #ff9f0a;\n  --c-sky:    #61aff7;\n  --c-blue:   #0a84ff;\n  --c-pink:   #ff375f;\n  --c-lilac:  #bf5af2;\n\n  --c-almond: #544845;\n  --c-cream:  #73635F;\n\n  --tag-green:      #42764F;\n  --tag-yellow:     #E1BC00;\n  --tag-red:        #8F2620;\n  --tag-orange:     #CA8519;\n  --tag-blue:       #094887;\n  --tag-pink:       #861F70;\n  --tag-purple:     #601F80;\n  --tag-light-blue: #008299;\n\n  --marketing-green: #B5E09B;\n}\n\n/* ================= Base / semantic element styles ================ */\nhtml { font-size: 17px; }\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  background: var(--bg-default);\n  color: var(--fg-primary);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-feature-settings: \"liga\" off;\n  margin: 0;\n}\nh5, h6 { font-family: var(--font-body); font-weight: 400; margin: 0; }\n\nh1 { font-size: var(--h1-size); line-height: var(--h1-lh); letter-spacing: var(--h1-ls); }\nh2 { font-size: var(--h2-size); line-height: var(--h2-lh); letter-spacing: var(--h2-ls); }\nh3 { font-size: var(--h3-size); line-height: var(--h3-lh); letter-spacing: var(--h3-ls); }\nh4 { font-size: var(--h4-size); line-height: var(--h4-lh); letter-spacing: var(--h4-ls); }\nh5 { font-size: var(--h5-size); line-height: var(--h5-lh); letter-spacing: var(--h5-ls); }\nh6 { font-size: var(--h6-size); line-height: var(--h6-lh); letter-spacing: var(--h6-ls); }\n\np, .body1 { font: 400 var(--body1-size)/var(--body1-lh) var(--font-body); letter-spacing: var(--body1-ls); margin: 0; }\n.body2    { font: 400 var(--body2-size)/var(--body2-lh) var(--font-body); letter-spacing: var(--body2-ls); }\n.caption  { font: 400 var(--caption-size)/var(--caption-lh) var(--font-body); }\n.overline { font: 400 var(--overline-size)/var(--overline-lh) var(--font-body); text-transform: uppercase; letter-spacing: 1px; }\n.tag      { font: 400 var(--tag-size)/var(--tag-lh) var(--font-body); }\n\ncode, pre { font-family: var(--font-mono); }\n\n/* Marketing / hero scale — use on landing pages */\n.display-1 { font: 400 72px/100% var(--font-display); letter-spacing: -8.7px; }\n.display-2 { font: 400 54px/100% var(--font-display); letter-spacing: -6.2px; }\n.display-3 { font: 400 40px/100% var(--font-display); letter-spacing: -4px; }\n\n/* Buttons */\n.btn {\n  font: 500 var(--btn-lg-size)/var(--btn-lg-lh) var(--font-body);\n  letter-spacing: var(--btn-lg-ls);\n  padding: 12px 20px;\n  border-radius: var(--radius);\n  cursor: pointer;\n  border: none;\n  display: inline-flex; align-items: center; gap: 8px;\n  transition: opacity 120ms ease, transform 120ms ease, background-color 120ms ease;\n}\n.btn:hover { opacity: 0.92; }\n.btn:active { transform: scale(0.98); }\n.btn-primary   { background: var(--cta-primary-bg); color: var(--cta-primary-fg); }\n.btn-secondary { background: var(--cta-secondary-bg); color: var(--cta-secondary-fg); }\n.btn-outline   { background: transparent; color: var(--fg-primary); border: 1px solid var(--fg-primary); }\n.btn-small     { font-size: var(--btn-sm-size); line-height: var(--btn-sm-lh); letter-spacing: var(--btn-sm-ls); padding: 8px 14px; }\n\n/* Mobile scale overrides */\n@media (max-width: 768px) {\n  :root {\n    --h1-size: 31px; --h1-ls: -3.35px; --h1-lh: 110%;\n    --h2-size: 27px; --h2-ls: -2.8px;  --h2-lh: 114%;\n    --h3-size: 24px; --h3-ls: -2px;    --h3-lh: 118%;\n    --h4-size: 22px; --h4-ls: -2px;\n    --gutter-desktop: 24px;\n  }\n  .display-1 { font-size: 42px; letter-spacing: -5px; }\n  .display-2 { font-size: 35px; letter-spacing: -4.1px; }\n  .display-3 { font-size: 29px; letter-spacing: -3px; }\n}\n<\u002Fstyle>\n  <script src=\"0a71f6c9-8a61-4fcc-8dbd-3eb0dd3702f3\"><\u002Fscript>\n  <script src=\"e921600a-f288-4911-9bf4-4c2165e27173\"><\u002Fscript>\n  <style>\n    body { margin:0; background:#fff; font-family:'Lexend Deca', system-ui, sans-serif; color:#1a1a1a; -webkit-font-smoothing:antialiased; }\n    a { color:#103D2C; text-decoration:none; }\n    a:hover { color:#21c45b; text-decoration:underline; }\n    * { box-sizing:border-box; }\n    @keyframes pulseRing { 0%{transform:scale(1);opacity:.5} 70%{transform:scale(1.45);opacity:0} 100%{opacity:0} }\n    @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(33,196,91,.45)} 50%{box-shadow:0 0 0 9px rgba(33,196,91,0)} }\n    @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }\n    [data-node=\"light\"] svg { stroke: #fff !important; }\n    [data-node=\"gold\"] svg { stroke: #8a6d0f !important; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div data-screen-label=\"Grad Project released\" style=\"min-height:100vh;background:#fff;display:flex;font-family:'Lexend Deca', system-ui, sans-serif;position:relative;\">\n\n  <div style=\"flex:none;width:262px;border-right:1px solid #ececec;display:flex;flex-direction:column;background:#fff;\">\n    <div style=\"padding:26px 22px 20px;\">\n      <div style=\"font-weight:700;font-size:19px;line-height:1.25;letter-spacing:-.3px;\">Product Manager<br>Fellowship<\u002Fdiv>\n      <div style=\"font-size:13px;color:#8a8a8a;margin-top:6px;\">Apr 4 - Jul 12<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;gap:2px;padding:0 12px;\">\n      <sc-for list=\"{{ nav }}\" as=\"n\" hint-placeholder-count=\"13\">\n        <div sc-camel-on-click=\"{{ n.go }}\" style=\"{{ n.style }}\"><span data-icon=\"{{ n.icon }}\" style=\"display:contents\"><i data-lucide=\"{{ n.icon }}\" style=\"{{ n.iconStyle }}\"><\u002Fi><\u002Fspan>{{ n.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"padding:16px 22px;border-top:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;gap:12px;\">\n      <img src=\"fabbe19e-ac69-4bab-b507-21f72fa5ce57\" alt=\"NextLeap\" style=\"height:22px;width:auto;display:block;\">\n      <div style=\"display:flex;align-items:center;gap:6px;\">\n        <div style=\"width:32px;height:32px;border-radius:50%;background:#e7f6ec;border:1.5px solid #21c45b;\"><\u002Fdiv>\n        <span style=\"display:contents\"><i data-lucide=\"chevron-up\" style=\"font-size:16px;color:#8a8a8a;\"><\u002Fi><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;\">\n    <div style=\"padding:19px 34px;border-bottom:1px solid #ececec;display:flex;align-items:center;justify-content:space-between;gap:16px;\">\n      <div style=\"font-size:16.5px;font-weight:600;\">{{ pageTitle }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;\">\n        <span style=\"font-size:12px;color:#a0a0a0;\">Prototype state<\u002Fspan>\n        <sc-for list=\"{{ stateChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.style }}\">{{ c.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <sc-if value=\"{{ isGradPage }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:34px;padding:0 34px;border-bottom:1px solid #ececec;\">\n      <div style=\"display:flex;align-items:center;gap:9px;padding:15px 2px 13px;font-size:15px;color:#8a8a8a;border-bottom:2px solid transparent;margin-bottom:-1px;\"><span style=\"display:contents\"><i data-lucide=\"clipboard-list\" style=\"font-size:18px;\"><\u002Fi><\u002Fspan>Milestone<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;padding:15px 2px 13px;font-size:15px;font-weight:600;color:#1a1a1a;border-bottom:2px solid #1a1a1a;margin-bottom:-1px;\"><span style=\"display:contents\"><i data-lucide=\"star\" style=\"font-size:18px;\"><\u002Fi><\u002Fspan>Graduation Project<\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"flex:1;padding:36px 34px 90px;\">\n      <sc-if value=\"{{ isGradPage }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:26px;\">\n\n        <div>\n          <h1 style=\"margin:0 0 8px;font-family:'Lexend Exa', system-ui, sans-serif;font-weight:400;font-size:42px;letter-spacing:-1.7px;line-height:1.02;\">Graduation Project<\u002Fh1>\n          <p style=\"margin:0;font-size:16px;color:#5c5c5c;max-width:640px;text-wrap:pretty;\">{{ statusNote }}<\u002Fp>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasTrack }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;align-items:stretch;gap:0;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;\">\n          <sc-for list=\"{{ track }}\" as=\"t\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ t.select }}\" style=\"{{ t.cell }}\">\n              <div style=\"display:flex;align-items:center;margin-bottom:12px;\">\n                <div style=\"{{ t.badge }}\">\n                  <sc-if value=\"{{ t.isLive }}\" hint-placeholder-val=\"{{ true }}\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:none;\">\n                      <path d=\"M8 11V7a4 4 0 0 1 8 0v1.5\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n                      <rect x=\"2.5\" y=\"11\" width=\"14\" height=\"10.5\" rx=\"2.2\" fill=\"currentColor\"><\u002Frect>\n                      <circle cx=\"9.5\" cy=\"15.4\" r=\"1.5\" fill=\"#fff\"><\u002Fcircle>\n                      <rect x=\"8.75\" y=\"15.4\" width=\"1.5\" height=\"3.4\" rx=\".75\" fill=\"#fff\"><\u002Frect>\n                    <\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ t.isLocked }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:none;\">\n                      <path d=\"M7.6 11V7a4.4 4.4 0 0 1 8.8 0v4\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\"><\u002Fpath>\n                      <rect x=\"4\" y=\"11\" width=\"16\" height=\"10.5\" rx=\"2.2\" fill=\"currentColor\"><\u002Frect>\n                      <circle cx=\"12\" cy=\"15.4\" r=\"1.5\" fill=\"#f0f0f0\"><\u002Fcircle>\n                      <rect x=\"11.25\" y=\"15.4\" width=\"1.5\" height=\"3.4\" rx=\".75\" fill=\"#f0f0f0\"><\u002Frect>\n                    <\u002Fsvg>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ t.isUsed }}\" hint-placeholder-val=\"{{ false }}\">\n                    <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex:none;\">\n                      <circle cx=\"12\" cy=\"12\" r=\"9.5\" fill=\"currentColor\"><\u002Fcircle>\n                      <path d=\"M8 12.4l2.7 2.7L16 9.8\" stroke=\"#f0f0f0\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n                    <\u002Fsvg>\n                  <\u002Fsc-if>\n                  {{ t.state }}\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14.5px;font-weight:600;margin-bottom:4px;text-align:left;\">{{ t.title }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8a8a8a;line-height:1.5;text-align:left;\">{{ t.sub }}<\u002Fdiv>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"{{ detailGridStyle }}\">\n        <sc-if value=\"{{ hasDetail }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"{{ sel.cardStyle }}\">\n            <div style=\"{{ sel.bodyStyle }}\">\n              <div style=\"width:100%;min-width:0;\">\n                <div style=\"{{ sel.dateCardStyle }}\">\n                  <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;\">\n                    <span style=\"font-size:13px;font-weight:600;color:#8a8a8a;\">{{ sel.label }}<\u002Fspan>\n                    <sc-if value=\"{{ sel.hasMeta }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"flex:none;{{ sel.metaDotStyle }}\"><\u002Fspan>\n                      <span style=\"{{ sel.metaStyle }}\">{{ sel.meta }}<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-size:13px;color:#8a8a8a;margin-bottom:4px;\">{{ sel.dateLabel }}<\u002Fdiv>\n                  <h2 style=\"{{ sel.dateBigStyle }}\">{{ sel.dateBig }}<\u002Fh2>\n                  <div style=\"{{ sel.dateSubStyle }}\">{{ sel.dateSub }}<\u002Fdiv>\n                  <sc-if value=\"{{ sel.hasMeter }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"margin-top:16px;max-width:400px;\">\n                      <div style=\"position:relative;height:10px;border-radius:100px;background:#f2f2f2;\">\n                        <div style=\"{{ sel.meterFill }}\"><\u002Fdiv>\n                        <div style=\"position:absolute;left:70%;top:-4px;bottom:-4px;width:2px;background:#1a1a1a;border-radius:2px;\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"position:relative;height:15px;margin-top:7px;\">\n                        <span style=\"position:absolute;left:70%;transform:translateX(-50%);font-size:11px;font-weight:600;color:#1a1a1a;white-space:nowrap;\">70% clears<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ sel.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n                  <p style=\"margin:16px 28px 0;font-size:14px;color:#5c5c5c;line-height:1.6;text-wrap:pretty;\">{{ sel.note }}<\u002Fp>\n le }}\"><span style=\"display:contents\"><i data-lucide=\"calendar-clock\" style=\"width:18px;height:18px;color:#fff;\"><\u002Fi><\u002Fspan><\u002Fspan>\n            <div>\n              <div style=\"font-size:14.5px;font-weight:600;\">Submission deadline : {{ briefDeadlineLong }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#5c5c5c;margin-top:2px;\">{{ briefDeadlineNote }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:38px;font-size:15px;color:#1a1a1a;line-height:1.75;\">\n            <p style=\"margin:0 0 12px;\"><strong>Choose any ONE product:<\u002Fstrong><\u002Fp>\n            <ul style=\"margin:0 0 22px;padding-left:22px;\">\n              <li>Spotify<\u002Fli>\n              <li>Gaana<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin:0 0 14px;\">You are a Product Manager on the Growth Team at your chosen company.<\u002Fp>\n            <p style=\"margin:0 0 14px;\">The company has acquired millions of users and built one of the world's most sophisticated recommendation systems. A significant share of listening still comes from repeat playlists, familiar artists and previously discovered tracks.<\u002Fp>\n            <p style=\"margin:0 0 26px;\">One of the strategic goals is to increase meaningful music discovery and reduce repetitive listening behaviour.<\u002Fp>\n            <h2 style=\"margin:0 0 14px;font-family:'Lexend Exa', system-ui, sans-serif;font-weight:400;font-size:25px;letter-spacing:-1.1px;\">Part 1: Build an AI powered review discovery engine<\u002Fh2>\n            <p style=\"margin:0 0 12px;\">Before proposing any solution, build an AI powered system that analyses user feedback at scale. You may use Claude, GPTs, agents, workflows, RAG systems, n8n or Zapier.<\u002Fp>\n            <h2 style=\"margin:26px 0 14px;font-family:'Lexend Exa', system-ui, sans-serif;font-weight:400;font-size:25px;letter-spacing:-1.1px;\">Part 2: Design the discovery experience<\u002Fh2>\n            <p style=\"margin:0 0 12px;\">Translate what the engine surfaces into a product solution. Define the user segment, the intervention, the rollout and the metrics you would move.<\u002Fp>\n            <h2 style=\"margin:26px 0 14px;font-family:'Lexend Exa', system-ui, sans-serif;font-weight:400;font-size:25px;letter-spacing:-1.1px;\">Deliverables<\u002Fh2>\n            <ul style=\"margin:0;padding-left:22px;\">\n              <li>A 9 to 10 slide deck, PDF only<\u002Fli>\n              <li>Named FirstName_LastName_Attempt{{ attemptNo }}.pdf<\u002Fli>\n              <li>Uploaded on the Submissions tab before the deadline<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSubmissions }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:840px;margin:0 auto;padding:42px 34px 90px;\">\n          <div style=\"font-size:12.5px;color:#8a8a8a;margin-bottom:6px;\">Graduation Project - {{ briefMonth }}<\u002Fdiv>\n          <h1 style=\"margin:0 0 6px;font-family:'Lexend Exa', system-ui, sans-serif;font-weight:400;font-size:34px;letter-spacing:-1.5px;line-height:1.15;\">{{ subStatus }}<\u002Fh1>\n          <p style=\"margin:0 0 20px;font-size:14.5px;color:#5c5c5c;\">{{ subLine }}<\u002Fp>\n          <div style=\"border:1px solid #ececec;background:#fafafa;border-radius:8px;padding:16px 18px;display:flex;align-items:center;gap:14px;\">\n            <span style=\"{{ deadlineIconStyle }}\"><span style=\"display:contents\"><i data-lucide=\"calendar-clock\" style=\"width:18px;height:18px;color:#fff;\"><\u002Fi><\u002Fspan><\u002Fspan>\n            <div style=\"font-size:14.5px;font-weight:600;\">Submission deadline : {{ briefDeadlineLong }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ canUpload }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"margin-top:34px;max-width:520px;\">\n              <div style=\"border:1px dashed #cfcfcf;border-rad n-bottom:6px;\">\n                      <div style=\"font-size:12px;font-weight:600;color:#8a8a8a;letter-spacing:.2px;\">{{ f.label }}<\u002Fdiv>\n                      <span style=\"{{ f.tagStyle }}\">{{ f.type }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:13.5px;color:#1a1a1a;line-height:1.5;\">{{ f.value }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"border:1px dashed #d4d4d4;border-radius:8px;padding:16px;font-size:13px;color:#8a8a8a;line-height:1.6;\">\n            Nothing on the learner page is free-form prose. Every block above is a field, so the same layout holds for PMF, UDF, DAF and BAF with different values.\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1100}}\">\nclass Component extends DCLogic {\n  state = { view: 'live', pick: 0, admin: false, sel: null, modal: null, tab: 'details', page: 'grad', submitted: false };\n  componentDidMount() { this.icons(); }\n  componentDidUpdate() { this.icons(); }\n  icons() {\n    if (!window.lucide) return;\n    document.querySelectorAll('[data-icon]').forEach(w => {\n      const want = w.getAttribute('data-icon');\n      const svg = w.querySelector('svg');\n      if (!want || !svg || svg.classList.contains('lucide-' + want)) return;\n      const st = svg.getAttribute('style') || '';\n      w.innerHTML = '<i data-lucide=\"' + want + '\" style=\"' + st.replace(/\"/g, '') + '\"><\u002Fi>';\n    });\n    window.lucide.createIcons();\n  }\n\n  renderVals() {\n    const v = this.state.view;\n\n    const navDefs = [\n      ['Overview', 'layout-grid'], ['Your Tasks', 'square-check-big'], ['Practice', 'terminal'],\n      ['Announcement', 'megaphone (2, 'Aug 2026', 'na', { sub: 'Cleared in attempt 1', state: 'Not needed' }),\n        A(3, 'Sep 2026', 'na', { sub: 'Cleared in attempt 1', state: 'Not needed' })\n      ],\n      done: [\n        A(1, 'Jul 2026', 'closed', { sub: 'Scored 62%', state: 'Closed', ps: P1, score: '62%', note: 'You did not clear it. The full breakdown is on the result page.' }),\n        A(2, 'Aug 2026', 'closed', { sub: 'Not submitted', state: 'Closed', ps: P2, score: null, note: 'This window closed without a submission.' }),\n        A(3, 'Sep 2026', 'closed', { sub: 'Scored 58%', state: 'Closed', ps: P3, score: '58%', note: 'You did not clear it. The full breakdown is on the result page.' })\n      ]\n    };\n    const raw = trackDefs[v] || [];\n    const openable = i => raw[i] && raw[i].s !== 'lock' && raw[i].s !== 'na';\n    const daysLeft = n => parseInt(n, 10) || 0;\n    let selIdx = this.state.sel;\n    if (selIdx == null || !openable(selIdx)) {\n      const liveIdx = raw.findIndex(t => t.s === 'live' || t.s === 'sent' || t.s === 'pass');\n      const lastClosed = raw.map(t => t.s).lastIndexOf('closed');\n      selIdx = liveIdx >= 0 ? liveIdx : lastClosed >= 0 ? lastClosed : (raw.length ? 0 : -1);\n    }\n    const track = raw.map((t, i) => ({\n      ...t,\n      isLive: t.s === 'live', isLocked: t.s === 'lock' || t.s === 'na', isUsed: t.s === 'closed' || t.s === 'sent' || t.s === 'pass',\n      select: (t.s === 'lock' || t.s === 'na') ? undefined : () => this.setState({ sel: i }),\n      cell: \"flex:1;padding:20px 22px;text-align:left;font-family:'Lexend Deca', system-ui, sans-serif;border:0;border-radius:0;\"\n        + ((t.s === 'lock' || t.s === 'na') ? 'cursor:default;' : 'cursor:pointer;')\n        + (i < raw.length - 1 ? 'border-right:1px solid #e5e5e5;' : '')\n        + (i === selIdx && t.s !== 'lock' && t.s !== 'na' ? 'background:#fff;box-shadow:inset 0 -3px 0 #1a1a1a;' : 'background:#E9F1EE;'),\n      badge: 'display:inline-flex;align-items:center;gap:8px;font-size:12. ty of solution', max: 100 },\n        { name: 'Data & metrics orientation', max: 40 }\n      ].map((c, i) => ({\n        name: c.name, max: c.max,\n        you: (c.max * fbSplit[i] / 100).toFixed(2),\n        median: (c.max * 0.72).toFixed(2),\n        top: (c.max * (i === 3 ? 1 : 0.94)).toFixed(2)\n      })),\n      pageTitle: this.state.page === 'certs' ? 'My Certificates' : 'Final Project',\n      isGradPage: this.state.page === 'grad',\n      isCertsPage: this.state.page === 'certs',\n      goGrad: () => this.setState({ page: 'grad' }),\n      adminOpen: this.state.admin,\n      adminBtnLabel: this.state.admin ? 'Close admin' : 'Admin config',\n      toggleAdmin: () => this.setState(s => ({ admin: !s.admin }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
