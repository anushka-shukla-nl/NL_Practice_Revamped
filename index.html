document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

een-text:   #0a7d41;  /* accessible green-on-white */\n  --brand-green-tint:   #005353;\n\n  /* ---------- Semantic / iOS-like accents (Light) ---------- */\n  --c-green:  #34c759;\n  --c-yellow: #ffcc00;\n  --c-red:    #ff3b30;\n  --c-orange: #ff9500;\n  --c-sky:    #48a3f7;\n  --c-blue:   #007aff;\n  --c-pink:   #ff2d55;\n  --c-lilac:  #af52de;\n  --c-rose:   #f36b83;\n  --c-teal:   #21d3f3;\n\n  /* ---------- Warm neutrals (imagery / mast-head fills) ---------- */\n  --c-almond: #FCE7CF;\n  --c-cream:  #FEF3E7;\n\n  /* ---------- Tag palette (Light) ---------- */\n  --tag-green:      #96D9A7;\n  --tag-yellow:     #FFE561;\n  --tag-red:        #FBA5A0;\n  --tag-orange:     #FFBC53;\n  --tag-blue:       #86C2FF;\n  --tag-pink:       #F4AAFB;\n  --tag-purple:     #CAA9FF;\n  --tag-light-blue: #8DDDEB;\n\n  /* Soft course-card tag bg from odin */\n  --tag-soft-green: #d0eabe;\n  --tag-soft-cream: #fefaf1; /* wall of praise bg */\n\n  /* Marketing-specific: used on dark BGs */\n  --marketing-green: #408B6C;\n\n  /* ---------- Radii / shadows / spacing ---------- */\n  --radius-sm: 4px;\n  --radius:    8px;           /* canonical — cards, buttons, inputs */\n  --radius-lg: 12px;\n  --radius-pill: 100px;\n\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);\n  --shadow:    0 2px 8px rgba(0,0,0,0.08);\n  --shadow-lg: 0 10px 40px -10px rgba(0,0,0,0.20);\n  --shadow-glow-green: 0 10px 40px -10px #2af77355;\n\n  /* Content gutters */\n  --gutter-desktop: 64px;\n  --gutter-mobile:  24px;\n  --max-content:    1200px;\n\n  /* ---------- Semantic typography tokens (Default / App-side, desktop) ---------- */\n  --h1-size: 42px;   --h1-lh: 114%; --h1-ls: -3.35px;\n  --h2-size: 35px;   --h2-lh: 120%; --h2-ls: -2.8px;\n  --h3-size: 30px;   --h3-lh: 125%; --h3-ls: -2.5px;\n  --h4-size: 22px;   --h4-lh: 128%; --h4-ls: -2.25px;\n  --h5-size: 19px;   --h5-lh: 145%; --h5-ls: 0.15px;\n  --h6-size: 19px;   --h6-lh: 145%; --h6-ls: 0.15px;\n\n  --body1-size: 17px; --body1-lh: 160%; --body1-ls: 0.25px;\n  --body2-size: 15px; --body2-lh: 160%; --body2-ls: 0.25px;\n  --caption-size: 13px; --caption-lh: 150%;\n  --overline-size: 11px; --overline-lh: 100%;\n  --tag-size: 12px; --tag-lh: 110%;\n\n  --btn-lg-size: 17px;  --btn-lg-lh: 118%; --btn-lg-ls: 0.5px;\n  --btn-sm-size: 15px;  --btn-sm-lh: 134%; --btn-sm-ls: 0.25px;\n}\n\n/* ================= Dark theme ==================== */\n[data-theme=\"dark\"], .theme-dark {\n  --bg-default:    #0c0c0c;\n  --bg-primary:    #0c0c0c;\n  --bg-secondary:  #141414;\n  --bg-tertiary:   #1f1f1f;\n  --bg-quaternary: rgba(255,255,255,0.30);\n  --bg-quaternary-light: rgba(255,255,255,0.05);\n  --bg-input:      #2e2e2e;\n  --bg-card:       #1f1f1f;\n  --bg-overlay:    rgba(40,40,40,0.90);\n\n  --fg-primary:    rgba(255,255,255,1);\n  --fg-secondary:  rgba(255,255,255,0.75);\n  --fg-tertiary:   rgba(255,255,255,0.60);\n  --fg-disabled:   rgba(255,255,255,0.40);\n  --fg-on-dark:    rgba(255,255,255,1);\n\n  --border:     rgba(255,255,255,0.10);\n  --separator:  rgba(255,255,255,0.10);\n  --divider:    rgba(255,255,255,0.10);\n\n  --cta-primary-bg:   #2af773;\n  --cta-primary-fg:   rgba(0,0,0,0.96);\n  --cta-secondary-bg: #ffffff;\n  --cta-secondary-fg: rgba(0,0,0,0.96);\n\n  --brand-green-text: #2af773;\n\n  /* iOS-like accents shift for dark */\n  --c-green:  #30d158;\n  --c-yellow: #ffd60a;\n  --c-red:    #ff453a;\n  --c-orange: #ff9f0a;\n  --c-sky:    #61aff7;\n  --c-blue:   #0a84ff;\n  --c-pink:   #ff375f;\n  --c-lilac:  #bf5af2;\n\n  --c-almond: #544845;\n  --c-cream:  #73635F;\n\n  --tag-green:      #42764F;\n  --tag-yellow:     #E1BC00;\n  --tag-red:        #8F2620;\n  --tag-orange:     #CA8519;\n  --tag-blue:       #094887;\n  --tag-pink:       #861F70;\n  --tag-purple:     #601F80;\n  --tag-light-blue: #008299;\n\n  --marketing-green: #B5E09B;\n}\n\n/* ================= Base / semantic element styles ================ */\nhtml { font-size: 17px; }\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  background: var(--bg-default);\n  color: var(--fg-primary);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-feature-settings: \"liga\" off;\n  margin: 0;\n}\nh5, h6 { font-family: var(--font-body); font-weight: 400; margin: 0; }\n\nh1 { font-size: var(--h1-size); line-height: var(--h1-lh); letter-spacing: var(--h1-ls); }\nh2 { font-size: var(--h2-size); line-height: var(--h2-lh); letter-spacing: var(--h2-ls); }\nh3 { font-size: var(--h3-size); line-height: var(--h3-lh); letter-spacing: var(--h3-ls); }\nh4 { font-size: var(--h4-size); line-height: var(--h4-lh); letter-spacing: var(--h4-ls); }\nh5 { font-size: var(--h5-size); line-height: var(--h5-lh); letter-spacing: var(--h5-ls); }\nh6 { font-size: var(--h6-size); line-height: var(--h6-lh); letter-spacing: var(--h6-ls); }\n\np, .body1 { font: 400 var(--body1-size)/var(--body1-lh) var(--font-body); letter-spacing: var(--body1-ls); margin: 0; }\n.body2    { font: 400 var(--body2-size)/var(--body2-lh) var(--font-body); letter-spacing: var(--body2-ls); }\n.caption  { font: 400 var(--caption-size)/var(--caption-lh) var(--font-body); }\n.overline { font: 400 var(--overline-size)/var(--overline-lh) var(--font-body); text-transform: uppercase; letter-spacing: 1px; }\n.tag      { font: 400 var(--tag-size)/var(--tag-lh) var(--font-body); }\n\ncode, pre { font-family: var(--font-mono); }\n\n/* Marketing / hero scale — use on landing pages */\n.display-1 { font: 400 72px/100% var(--font-display); letter-spacing: -8.7px; }\n.display-2 { font: 400 54px/100% var(--font-display); letter-spacing: -6.2px; }\n.display-3 { font: 400 40px/100% var(--font-display); letter-spacing: -4px; }\n\n/* Buttons */\n.btn {\n  font: 500 var(--btn-lg-size)/var(--btn-lg-lh) var(--font-body);\n  letter-spacing: var(--btn-lg-ls);\n  padding: 12px 20px;\n  border-radius: var(--radius);\n  cursor: pointer;\n  border: none;\n  display: inline-flex; align-i :     #f5f5f5;  /* card/panel alt */\n  --bg-quaternary:   rgba(0,0,0,0.10);\n  --bg-quaternary-light: rgba(0,0,0,0.05);\n  --bg-input:        #ffffff;\n  --bg-card:         #ffffff;\n  --bg-overlay:      rgba(203,203,203,0.80);\n\n  /* ---------- Foreground / Text (Light) ---------- */\n  --fg-primary:    rgba(0,0,0,0.96);\n  --fg-secondary:  rgba(0,0,0,0.75);\n  --fg-tertiary:   rgba(0,0,0,0.60);\n  --fg-disabled:   rgba(0,0,0,0.40);\n  --fg-on-dark:    rgba(255,255,255,1);\n\n  /* ---------- Borders / Dividers ---------- */\n  --border:       #E5E5E5;\n  --separator:    #000000;\n  --divider:      rgba(26,26,26,0.10);\n\n  /* ---------- Brand & CTAs ---------- */\n  --cta-primary-bg:   #21c45b;    /* NextLeap green */\n  --cta-primary-fg:   #ffffff;\n  --cta-secondary-bg: #0c0c0c;    /* Near-black */\n  --cta-secondary-fg: #ffffff;\n\n  --brand-green:        #21c45b;  /* primary */\n  --brand-green-bright: #2af773;  /* dark-mode accent, also \"primary_green\" in light */\n  --brand-green-text:   #0a7d41;  /* accessible green-on-white */\n  --brand-green-tint:   #005353;\n\n  /* ---------- Semantic / iOS-like accents (Light) ---------- */\n  --c-green:  #34c759;\n  --c-yellow: #ffcc00;\n  --c-red:    #ff3b30;\n  --c-orange: #ff9500;\n  --c-sky:    #48a3f7;\n  --c-blue:   #007aff;\n  --c-pink:   #ff2d55;\n  --c-lilac:  #af52de;\n  --c-rose:   #f36b83;\n  --c-teal:   #21d3f3;\n\n  /* ---------- Warm neutrals (imagery / mast-head fills) ---------- */\n  --c-almond: #FCE7CF;\n  --c-cream:  #FEF3E7;\n\n  /* ---------- Tag palette (Light) ---------- */\n  --tag-green:      #96D9A7;\n  --tag-yellow:     #FFE561;\n  --tag-red:        #FBA5A0;\n  --tag-orange:     #FFBC53;\n  --tag-blue:       #86C2FF;\n  --tag-pink:       #F4AAFB;\n  --tag-purple:     #CAA9FF;\n  --tag-light-blue: #8DDDEB;\n\n  /* Soft course-card tag bg from odin */\n  --tag-soft-green: #d0eabe;\n  --tag-soft-cream: #fefaf1; /* wall of praise bg */\n\n  /* Marketing-specific: used on dark BGs */\n  --marketing-green: #408B6C;\n\n  /* ---------- Radii / shadows / spacing ---------- */\n  --radius-sm: 4px;\n  --radius:    8px;           /* canonical — cards, buttons, inputs */\n  --radius-lg: 12px;\n  --radius-pill: 100px;\n\n  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);\n  --shadow:    0 2px 8px rgba(0,0,0,0.08);\n  --shadow-lg: 0 10px 40px -10px rgba(0,0,0,0.20);\n  --shadow-glow-green: 0 10px 40px -10px #2af77355;\n\n  /* Content gutters */\n  --gutter-desktop: 64px;\n  --gutter-mobile:  24px;\n  --max-content:    1200px;\n\n  /* ---------- Semantic typography tokens (Default / App-side, desktop) ---------- */\n  --h1-size: 42px;   --h1-lh: 114%; --h1-ls: -3.35px;\n  --h2-size: 35px;   --h2-lh: 120%; --h2-ls: -2.8px;\n  --h3-size: 30px;   --h3-lh: 125%; --h3-ls: -2.5px;\n  --h4-size: 22px;   --h4-lh: 128%; --h4-ls: -2.25px;\n  --h5-size: 19px;   --h5-lh: 145%; --h5-ls: 0.15px;\n  --h6-size: 19px;   --h6-lh: 145%; --h6-ls: 0.15px;\n\n  --body1-size: 17px; --body1-lh: 160%; --body1-ls: 0.25px;\n  --body2-size: 15px; --body2-lh: 160%; --body2-ls: 0.25px;\n  --caption-size: 13px; --caption-lh: 150%;\n  --overline-size: 11px; --overline-lh: 100%;\n  --tag-size: 12px; --tag-lh: 110%;\n\n  --btn-lg-size: 17px;  --btn-lg-lh: 118%; --btn-lg-ls: 0.5px;\n  --btn-sm-size: 15px;  --btn-sm-lh: 134%; --btn-sm-ls: 0.25px;\n}\n\n/* ================= Dark theme ==================== */\n[data-theme=\"dark\"], .theme-dark {\n  --bg-default:    #0c0c0c;\n  --bg-primary:    #0c0c0c;\n  --bg-secondary:  #141414;\n  --bg-tertiary:   #1f1f1f;\n  --bg-quaternary: rgba(255,255,255,0.30);\n  --bg-quaternary-light: rgba(255,255,255,0.05);\n  --bg-input:      #2e2e2e;\n  --bg-card:       #1f1f1f;\n  --bg-overlay:    rgba(40,40,40,0.90);\n\n  --fg-primary:    rgba(255,255,255,1);\n  --fg-secondary:  rgba(255,255,255,0.75);\n  --fg-tertiary:   rgba(255,255,255,0.60);\n  --fg-disabled:   rgba(255,255,255,0.40);\n  --fg-on-dark:    rgba(255,255,255,1);\n\n  --border:     rgba(255,255,255,0.10);\n  --separator:  rgba(255,255,255,0.10);\n  --divider:    rgba(255,255,255,0.10);\n\n  --cta-primary-bg:   #2af773;\n  --cta-primary-fg:   rgba(0,0,0,0.96);\n  --cta-secondary-bg: #ffffff;\n  --cta-secondary-fg: rgba(0,0,0,0.96);\n\n  --brand-green-text: #2af773;\n\n  /* iOS-like accents shift for dark */\n  --c-green:  #30d158;\n  --c-yellow: #ffd60a;\n  --c-red:    #ff453a;\n  --c-orange: #ff9f0a;\n  --c-sky:    #61aff7;\n  --c-blue:   #0a84ff;\n  --c-pink:   #ff375f;\n  --c-lilac:  #bf5af2;\n\n  --c-almond: #544845;\n  --c-cream:  #73635F;\n\n  --tag-green:      #42764F;\n  --tag-yellow:     #E1BC00;\n  --tag-red:        #8F2620;\n  --tag-orange:     #CA8519;\n  --tag-blue:       #094887;\n  --tag-pink:       #861F70;\n  --tag-purple:     #601F80;\n  --tag-light-blue: #008299;\n\n  --marketing-green: #B5E09B;\n}\n\n/* ================= Base / semantic element styles ================ */\nhtml { font-size: 17px; }\nbody {\n  margin: 0;\n  font-family: var(--font-body);\n  background: var(--bg-default);\n  color: var(--fg-primary);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n}\n\nh1, h2, h3, h4 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-feature-settings: \"liga\" off;\n  margin: 0;\n}\nh5, h6 { font-family: var(--font-body); font-weight: 400; margin: 0; }\n\nh1 { font-size: var(--h1-size); line-height: var(--h1-lh); letter-spacing: var(--h1-ls); }\nh2 { font-size: var(--h2-size); line-height: var(--h2-lh); letter-spacing: var(--h2-ls); }\nh3 { font-size: var(--h3-size); line-height: var(--h3-lh); letter-spacing: var(--h3-ls); }\nh4 { font-size: var(--h4-size); line-height: var(--h4-lh); letter-spacing: var(--h4-ls); }\nh5 { font-size: var(--h5-size); line-height: var(--h5-lh); letter-spacing: var(--h5-ls); }\nh6 { font-size: var(--h6-size); line-height: var(--h6-lh); letter-spacing: var(--h6-ls); }\n\np, .body1 { font: 400 var(--body1-size)/var(--body1-lh) var(--font-body); letter-spacing: var(--body1-ls); margin: 0; }\n.body2    { font: 400 var(--body2-size)/var(--body2-lh) var(--font-body); letter-spacing: var(--body2-ls); }\n.caption  { font: 400 var(--caption-size)/var(--caption-lh) var(--font-body); }\n.overline { font: 400 var(--overline-size)/var(--overline-lh) var(--font-body); text-transform: uppercase; letter-spacing: 1px; }\n.tag      { font: 400 var(--tag-size)/var(--tag-lh) var(--font-body); }\n\ncode, pre { font-family: var(--font-mono); }\n\n/* Marketing / hero scale — use on landing pages */\n.display-1 { font: 400 72px/100% var(--font-display); letter-spacing: -8.7px; }\n.display-2 { font: 400 54px/100% var(--font-display); letter-spacing: -6.2px; }\n.display-3 { font: 400 40px/100% var(--font-display); letter-spacing: -4px; }\n\n/* Buttons */\n.btn {\n  font: 500 var(--btn-lg-size)/var(--btn-lg-lh) var(--font-body);\n  letter-spacing: var(--btn-lg-ls);\n  padding: 12px 20px;\n  border-radius: var(--radius);\n  cursor: pointer;\n  border: none;\n  display: inline-flex; align-items: center; gap: 8px;\n  transition: opacity 120ms ease, transform 120ms ease, background-color 120ms ease;\n}\n.btn:hover { opacity: 0.92; }\n.btn:active { transform: scale(0.98); }\n.btn-primary   { background: var(--cta-primary-bg); color: var(--cta-primary-fg); }\n.btn-secondary { background: var(--cta-secondary-bg); color: var(--cta-secondary-fg); }\n.btn-outline   { background: transparent; color: var(--fg-primary); border: 1px solid var(--fg-primary); }\n.btn-small     { font-size: var(--btn-sm-size); line-height: var(--btn-sm-lh); letter-spacing: var(--btn-sm-ls); padding: 8px 14px; }\n\n/* Mobile scale overrides */\n@media (max-width: 768px) {\n  :root {\n    --h1-size: 31px; --h1-ls: -3.35px; --h1-lh: 110%;\n    --h2-size: 27px; --h2-ls: -2.8px;  --h2-lh: 114%;\n    --h3-size: 24px; --h3-ls: -2px;    --h3-lh: 118%;\n    --h4-size: 22px; --h4-ls: -2px;\n    --gutter-desktop: 24px;\n  }\n  .display-1 { font-size: 42px; letter-spacing: -5px; }\n  .display-2 { font-size: 35px; letter-spacing: -4.1px; }\n  .display-3 { font-size: 29px; letter-spacing: -3px; }\n}\n\n<\u002Fstyle>\n<script src=\"a0fb034c-bd5b-44b9-b071-04039a01e591\"><\u002Fscript>\n<style>\n  * { box-sizing: border-box; }\n  body { background: #f4f5f4; margin: 0; }\n  a { color: #0a7d41; text-decoration: underline; }\n  a:hover { color: #0d3f27; }\n  ul.b { margin: 8px 0 14px; padding-left: 20px; }\n  ul.b li, ol.b li { font: 400 14px/165% var(--font-body); color: rgba(0,0,0,0.85); margin-bottom: 8px; }\n  ol.b { margin: 8px 0 16px; padding-left: 22px; }\n<\u002Fstyle>\n\n<\u002Fhelmet>\n\n<div style=\"font-family:var(--font-body); color:var(--fg-primary); min-height:100vh\">\n\n  <div style=\"display:flex; flex-wrap:{{ statesWrap }}; overflow-x:auto; gap:8px; align-items:center; padding:12px clamp(12px,2vw,20px); background:#fff; border-bottom:1px dashed var(--border)\">\n    <span style=\"font:400 11px/100% var(--font-body); text-transform:uppercase; letter-spacing:1px; color:var(--fg-tertiary); margin-right:4px; white-space:nowrap; flex:0 0 auto\">Prototype states<\u002Fspan>\n    <sc-for list=\"{{ rail }}\" as=\"r\" hint-placeholder-count=\"6\">\n      <div sc-camel-on-click=\"{{ r.go }}\" style=\"cursor:pointer; white-space:nowrap; padding:7px 12px; border-radius:100px; font:400 12px/100% var(--font-body); border:1px solid {{ r.bd }}; background:{{ r.bg }}; color:{{ r.fg }}\">{{ r.label }}<\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; background:#fff; min-height:calc(100vh - 50px)\">\n\n    <aside style=\"display:{{ sideDisplay }}; width:248px; flex:0 0 248px; border-right:1px solid var(--border); flex-direction:column; justify-content:space-between\">\n      <div style=\"padding:22px 14px 0\">\n        <div style=\"padding:0 8px 20px\">\n          <div style=\"font:600 17px/126% var(--font-body); letter-spacing:-0.2px\">Product Manager Fellowship<\u002Fdiv>\n          <div style=\"font:400 12px/150% var(--font-body); color:var(--fg-tertiary); margin-top:5px\">Aug 1 - Nov 8<\u002Fdiv>\n        <\u002Fdiv>\n        <nav style=\"display:flex; flex-direction:column; gap:2px\">\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 12px; font:400 14px/140% var(--font-body); color:rgba(0,0,0,0.85)\"><img src=\"bed7fd6d-6e46-4750-be3a-30050eea5e32\" width=\"17\" height=\"17\" alt=\"\" style=\"opacity:0.85\"><span>Overview<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 12px; font:400 14px/140% var(--font-body); color:rgba(0,0,0,0.85)\"><img src=\"bf008828-d761-4a97-b36e-b8a697eb15ad\" width=\"17\" height=\"17\" alt=\"\" style=\"opacity:0.85\"><span>Your Tasks<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 12px; font:400 14px/140% var(--font-body); color:rgba(0,0,0,0.85)\"><img src=\"b3233dcb-6727-4e90-948b-cbd5e8b923f7\" width=\"17\" height=\"17\" alt=\"\" style=\"opacity:0.85\"><span>Practice<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 12px; font:400 14px/140% var(--font-body); color:rgba(0,0,0,0.85)\"><img src=\"b63d5fa5-cefd-44b2-9622-def5b421d9e0\" width=\"17\" height=\"17\" alt=\"\" style=\"opacity:0.85\"><span>Announcement<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:9px 12px; font:400 14px/140% var(--font-body); color:rgba(0,0,0,0.85)\"><img src=\"4e6dd35d-781b-4075-aa23-e74acb21b51c\" width=\"17\" height=\"17\" alt=\"\" style=\"opacity:0.85\"><span>Calendar &amp; Recordings<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px; background:#0d3f27; color:#fff; font:500 14px/140% var(--font-body)\"><img src=\"284b0806-6df0-4e3f-a34f-42b5c61d41ee\" width=\"17\" height=\"17\" alt=\"\" style=\"filter:invert(1)\"><span>Milestones &amp; Final Project<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Faside>\n\n    <main style=\"flex:1; min-width:0\">\n      <div style=\"display:{{ topbarDisplay }}; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--border)\">\n        <img src=\"00e37847-b452-455f-87b7-8e264394386a\" width=\"22\" height=\"22\" alt=\"\">\n        <img src=\"833df9a9-4c83-4646-918e-96a864612717\" width=\"92\" height=\"25\" alt=\"nextleap\">\n        <div style=\"width:28px; height:28px; border-radius:50%; background:#dfe6e1; border:1px solid var(--border)\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px; padding:22px clamp(16px,3vw,30px) 0\">\n        <div style=\"font:400 18px/140% var(--font-body)\">Milestones &amp; Final Project<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:28px; padding:18px clamp(16px,3vw,30px) 0; border-bottom:1px solid var(--border); overflow-x:auto\">\n        <div style=\"display:flex; align-items:center; gap:8px; padding-bottom:12px; border-bottom:2px solid #0c0c0c; font:600 14px/140% var(--font-body); white-space:nowrap\">\n          <img src=\"108e1fe7-ef5f-41d1-a443-120c8a1bbf1b\" width=\"16\" height=\"16\" alt=\"\" style=\"opacity:0.8\">\n          <span>Milestone<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:8px; padding-bottom:12px; color:rgba(0,0,0,0.6); font:400 14px/140% var(--font-body); white-space:nowrap\">\n          <img src=\"c57119ba-adb6-4ce9-acc7-83ffa8150a28\" width=\"16\" height=\"16\" alt=\"\" style=\"opacity:0.8\">\n          <span>Graduation Project<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n        <div style=\"display:none\">\n            <div style=\"border:1px solid var(--border); border-radius:8px; padding:16px 18px; display:flex; flex-direction:column; gap:10px; background:#fff\">\n              <div style=\"display:flex; align-items:center; gap:10px\">\n                <div style=\"width:26px; height:26px; flex:0 0 26px; border-radius:50%; background:#0c0c0c; color:#fff; display:flex; align-items:center; justify-content:center; font:500 12px/100% var(--font-body)\">2<\u002Fdiv>\n                <div style=\"font:600 15px/135% var(--font-body)\">Learn in Public<\u002Fdiv>\n                <span style=\"margin-left:auto; padding:3px 9px; border-radius:100px; background:var(--bg-secondary); font:500 11px/150% var(--font-body); color:var(--fg-secondary); white-space:nowrap\">Optional<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font:400 14px/155% var(--font-body); color:var(--fg-secondary)\">Share what you built on LinkedIn (10-15 min) and paste the post link. Same deadline as the project; no impact on placements or completion.<\u002Fdiv>\n              <div style=\"display:flex; flex-wrap:wrap; gap:8px\">\n                <button sc-camel-on-click=\"{{ openDetails }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #0c0c0c; border-radius:100px; padding:7px 13px; font:500 13px/130% var(--font-body); letter-spacing:normal; white-space:nowrap; flex:0 0 auto; cursor:pointer\" style-hover=\"background:#f5f5f5\">\n                  <span>Details &amp; policy<\u002Fspan>\n                  <img src=\"c88a6564-bae2-4c83-9eb4-0696bfb726f2\" width=\"13\" height=\"13\" alt=\"\">\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ openSample }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #0c0c0c; border-radius:100px; padding:7px 13px; font:500 13px/130% var(--font-body); letter-spacing:normal; white-space:nowrap; flex:0 0 auto; cursor:pointer\" style-hover=\"background:#f5f5f5\">\n                  <span>Sample post<\u002Fspan>\n                  <img src=\"c88a6564-bae2-4c83-9eb4-0696bfb726f2\" width=\"13\" height=\"13\" alt=\"\">\n                <\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"display:flex; align-items:flex-start; gap:10px; margin:auto -18px -16px; padding:12px 18px; border-top:1px solid #EFD98A; border-radius:0 0 7px 7px; background:#FBF0C9\">\n                <img src=\"f7fd4c33-b1a2-4729-b191-124044b69852\" width=\"16\" height=\"16\" alt=\"\" style=\"flex:0 0 16px; margin-top:1px; filter:invert(36%) sepia(62%) saturate(900%) hue-rotate(20deg) brightness(88%)\">\n                <span style=\"font:500 13px/145% var(--font-body); color:#0c0c0c\">Post for all milestones to earn {{ rewardNameLower }}.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n        <\u002Fdiv>\n\n      <div style=\"display:flex; flex-direction:{{ bodyDir }}; align-items:stretch\">\n\n        <div style=\"flex:{{ railFlex }}; min-width:0; border-right:{{ railBorderR }}; border-bottom:{{ railBorderB }}; padding:{{ railPad }}\">\n          <div style=\"display:flex; flex-direction:{{ railDir }}; gap:{{ railGap }}; overflow-x:{{ railOverflow }}; scroll-snap-type:x mandatory; padding-bottom:4px\">\n            <div style=\"display:grid; grid-template-columns:{{ railCols }}; gap:14px; align-items:start; flex:{{ cardFlex }}; scroll-snap-align:start\">\n              <div style=\"display:{{ numDisplay }}; flex-direction:column; align-items:center; align-self:stretch; padding-top:20px\">\n                <div style=\"width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:500 14px/100% var(--font-body); background:{{ g.numBg }}; color:{{ g.numFg }}\">0<\u002Fdiv>\n                <div style=\"width:1px; flex:1; background:var(--border); margin-top:6px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ g.select }}\" style=\"cursor:pointer; border:1px solid {{ g.cardBd }}; border-radius:8px; overflow:hidden; background:#fff; margin-bottom:{{ cardMb }}\">\n                <div style=\"padding:9px 14px; font:400 12px/130% var(--font-body); background:{{ g.hdrBg }}; color:{{ g.hdrFg }}\">Start here<\u002Fdiv>\n                <div style=\"padding:14px\">\n                  <div style=\"font:500 17px/130% var(--font-body); letter-spacing:-0.2px; text-wrap:pretty\">How Milestones &amp; Learn in Public challenge work<\u002Fdiv>\n                  <div style=\"font:400 13px/150% var(--font-body); color:var(--fg-tertiary); margin-top:5px\">The project, the Learn in Public challenge, deadlines and reward<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <sc-for list=\"{{ ms }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:{{ railCols }}; gap:14px; align-items:start; flex:{{ cardFlex }}; scroll-snap-align:start\">\n                <div style=\"display:{{ numDisplay }}; flex-direction:column; align-items:center; align-self:stretch; padding-top:20px\">\n                  <div style=\"width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font:500 14px/100% var(--font-body); background:{{ m.numBg }}; color:{{ m.numFg }}\">{{ m.n }}<\u002Fdiv>\n                  <div style=\"width:1px; flex:1; background:var(--border); margin-top:6px; display:{{ m.lineDisplay }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div sc-camel-on-click=\"{{ m.select }}\" style=\"cursor:pointer; border:1px solid {{ m.cardBd }}; border-radius:8px; overflow:hidden; background:#fff; margin-bottom:{{ cardMb }}\">\n                  <div style=\"padding:9px 14px; font:400 12px/130% var(--font-body); background:{{ m.hdrBg }}; color:{{ m.hdrFg }}\">Milestone {{ m.n }}<\u002Fdiv>\n                  <div style=\"padding:14px 14px 0\">\n                    <div style=\"font:500 17px/130% var(--font-body); letter-spacing:-0.2px; text-wrap:pretty\">{{ m.title }}<\u002Fdiv>\n                    <div style=\"font:400 13px/150% var(--font-body); color:var(--fg-tertiary); margin-top:5px\">{{ m.sub }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"margin:14px 14px 0; border-top:1px solid var(--border)\"><\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:8px; padding:12px 14px 14px\">\n                    <div style=\"display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 8px\">\n                      <span style=\"font:400 13px/140% var(--font-body); color:var(--fg-secondary)\">Milestone <strong style=\"font-weight:600; color:#0c0c0c\">{{ m.due }}<\u002Fstrong><\u002Fspan>\n                      <span style=\"padding:3px 10px; border-radius:6px; font:500 12px/150% var(--font-body); white-space:nowrap; background:{{ m.pTag2.bg }}; color:rgba(0,0,0,0.75)\">{{ m.pTag2.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 8px\">\n                      <span style=\"font:400 13px/140% var(--font-body); color:var(--fg-secondary)\">Learn in Public <strong style=\"font-weight:600; color:#0c0c0c\">{{ m.lipDue }}<\u002Fstrong><\u002Fspan>\n                      <span style=\"padding:3px 10px; border-radius:6px; font:500 12px/150% var(--font-body); white-space:nowrap; background:{{ m.lTag2.bg }}; color:rgba(0,0,0,0.75)\">{{ m.lTag2.label }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:none\">\n                    <span style=\"padding:4px 11px; border-radius:6px; font:500 12px/150% var(--font-body); white-space:nowrap; background:{{ m.tag.bg }}; color:rgba(0,0,0,0.75)\">{{ m.tag.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1 1 auto; min-width:0; padding:26px clamp(16px,3vw,32px) 60px; max-width:900px\">\n          <sc-if value=\"{{ guideOn }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:500 clamp(22px,2.6vw,28px)/124% var(--font-body); letter-spacing:-0.5px\">How Milestones &amp; Learn in Public challenge work<\u002Fdiv>\n            <div style=\"font:400 15px/165% var(--font-body); color:var(--fg-secondary); margin-top:8px; padding-bottom:22px; border-bottom:1px solid var(--border)\">Each milestone has two steps: build the project, then share it on LinkedIn.<\u002Fdiv>\n\n            <div style=\"border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-top:26px\">\n              <div style=\"background:#EDF2EF; color:#0c0c0c; border-bottom:1px solid var(--border); padding:20px clamp(16px,2.4vw,26px)\">\n                <div style=\"display:flex; align-items:center; gap:10px\">\n                  <div style=\"font:500 19px/130% var(--font-body)\">Step 1 · Milestone project<\u002Fdiv>\n                  <span style=\"padding:3px 9px; border-radius:100px; background:#fff; border:1px solid var(--border); font:500 11px/150% var(--font-body); white-space:nowrap\">Required<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font:400 14px/150% var(--font-body); color:var(--fg-secondary); margin-top:4px\">Apply what you learned in the sessions<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:12px; padding:18px clamp(16px,2.4vw,26px) 20px\">\n                <div style=\"display:flex; align-items:center; gap:12px; border:1px solid #0c0c0c; border-radius:8px; padding:14px 16px\">\n                  <img src=\"eae99b57-fe4e-4759-9109-73ddf57f6ee2\" width=\"18\" height=\"18\" alt=\"\" style=\"flex:0 0 18px\">\n                  <div style=\"min-width:0\"><div style=\"font:600 14px/140% var(--font-body)\">Build the project<\u002Fdiv><div style=\"font:400 13px/145% var(--font-body); color:var(--fg-secondary)\">Follow the problem statement<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:12px; border:1px solid #0c0c0c; border-radius:8px; padding:14px 16px\">\n                  <img src=\"96c485a3-95b2-4bb9-ae87-ea89cb604b99\" width=\"18\" height=\"18\" alt=\"\" style=\"flex:0 0 18px\">\n                  <div style=\"min-width:0\"><div style=\"font:600 14px/140% var(--font-body)\">Earn a certificate<\u002Fdiv><div style=\"font:400 13px/145% var(--font-body); color:var(--fg-secondary)\">For every milestone you submit<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-top:18px\">\n              <div style=\"background:#EDF2EF; color:#0c0c0c; border-bottom:1px solid var(--border); padding:20px clamp(16px,2.4vw,26px)\">\n                <div style=\"display:flex; align-items:center; gap:10px\">\n                  <div style=\"font:500 19px/130% var(--font-body)\">Step 2 · Learn in Public challenge<\u002Fdiv>\n                  <span style=\"padding:3px 9px; border-radius:100px; background:#fff; border:1px solid var(--border); font:500 11px/150% var(--font-body); white-space:nowrap\">Optional<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font:400 14px/150% var(--font-body); color:var(--fg-secondary); margin-top:4px\">Post what you built on LinkedIn · 10-15 min<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap:12px; padding:18px clamp(16px,2.4vw,26px) 20px\">\n                <div style=\"grid-column:1 / -1\">\n                  <div style=\"font:600 15px/140% var(--font-body)\">Rules to follow<\u002Fdiv>\n                  <div style=\"background:#EDF2EF; border:1px solid var(--border); border-radius:8px; padding:14px 18px; margin-top:10px\">\n                    <ul style=\"margin:0; padding-left:18px; display:flex; flex-direction:column; gap:8px; font:400 14px/155% var(--font-body); color:rgba(0,0,0,0.82)\">\n                      <li>Add “PM Fellow at NextLeap” to your LinkedIn profile<\u002Fli>\n                      <li>Number each post (e.g. 1/4), tag NextLeap and use #NextLeapPMFellowship<\u002Fli>\n                      <li>Write in your own words; copied or plagiarised posts are disqualified<\u002Fli>\n                      <li>Paste the post link here before the Learn in Public deadline<\u002Fli>\n                      <li>No impact on placements, fellowship completion or weekly rewards<\u002Fli>\n                    <\u002Ful>\n                  <\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ openSample }}\" style=\"margin-top:14px; display:inline-flex; align-items:center; gap:8px; background:#0c0c0c; color:#fff; border:none; border-radius:8px; padding:12px 18px; white-space:nowrap; font:500 14px/118% var(--font-body); cursor:pointer\">\n                    <span>View sample post<\u002Fspan>\n                  <\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:center; gap:12px; border-top:1px solid #EFD98A; background:#FBF0C9; padding:14px clamp(16px,2.4vw,26px); grid-column:1 / -1; margin:18px calc(clamp(16px,2.4vw,26px) * -1) -20px\">\n                  <img src=\"f7fd4c33-b1a2-4729-b191-124044b69852\" width=\"18\" height=\"18\" alt=\"\" style=\"flex:0 0 18px; filter:invert(36%) sepia(62%) saturate(900%) hue-rotate(20deg) brightness(88%)\">\n                  <div style=\"min-width:0; flex:1\"><div style=\"font:600 14px/140% var(--font-body)\">Reward<\u002Fdiv><div style=\"font:400 13px/145% var(--font-body); color:#7A5A00\">Post for all milestones to earn {{ rewardNameLower }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:none\">\n              <div style=\"display:grid; grid-template-columns:34px minmax(0,1fr); gap:14px; padding:20px clamp(14px,2vw,22px)\">\n                <div style=\"width:30px; height:30px; border-radius:50%; background:#0c0c0c; color:#fff; display:flex; align-items:center; justify-content:center; font:500 13px/100% var(--font-body)\">1<\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <div style=\"font:600 16px/140% var(--font-body)\">Build and submit the milestone project<\u002Fdiv>\n                  <div style=\"font:400 14px/160% var(--font-body); color:var(--fg-secondary); margin-top:6px\">Apply the skills from the modules you just finished. Read the problem statement, build the project and upload it before the project deadline.<\u002Fdiv>\n                  <div style=\"display:flex; align-items:center; gap:10px; margin-top:14px; padding:11px 14px; border-radius:8px; background:var(--bg-secondary)\">\n                    <img src=\"96c485a3-95b2-4bb9-ae87-ea89cb604b99\" width=\"16\" height=\"16\" alt=\"\" style=\"flex:0 0 16px\">\n                    <span style=\"font:500 13px/145% var(--font-body)\">Each submission earns you a certificate<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:34px minmax(0,1fr); gap:14px; padding:20px clamp(14px,2vw,22px); border-top:1px solid var(--border)\">\n                <div style=\"width:30px; height:30px; border-radius:50%; background:#0c0c0c; color:#fff; display:flex; align-items:center; justify-content:center; font:500 13px/100% var(--font-body)\">2<\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px\">\n                    <div style=\"font:600 16px/140% var(--font-body)\">Take the Learn in Public challenge<\u002Fdiv>\n                    <span style=\"padding:3px 9px; border-radius:100px; background:var(--bg-secondary); font:500 11px/150% var(--font-body); color:var(--fg-secondary); white-space:nowrap\">Optional<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:400 14px/160% var(--font-body); color:var(--fg-secondary); margin-top:6px\">Post about what you built on LinkedIn (10-15 min) and paste the post link on the milestone page. No impact on placements or fellowship completion; it builds a public portfolio recruiters can see.<\u002Fdiv>\n                  <div style=\"display:flex; flex-wrap:wrap; gap:8px; margin-top:14px\">\n                    <button sc-camel-on-click=\"{{ openDetails }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #0c0c0c; border-radius:100px; padding:7px 13px; font:500 13px/130% var(--font-body); white-space:nowrap; cursor:pointer\" style-hover=\"background:#f5f5f5\">\n                      <span>Details &amp; policy<\u002Fspan>\n                      <img src=\"c88a6564-bae2-4c83-9eb4-0696bfb726f2\" width=\"13\" height=\"13\" alt=\"\">\n                    <\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ openSample }}\" style=\"display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #0c0c0c; border-radius:100px; padding:7px 13px; font:500 13px/130% var(--font-body); white-space:nowrap; cursor:pointer\" style-hover=\"background:#f5f5f5\">\n                      <span>Sample post<\u002Fspan>\n                      <img src=\"c88a6564-bae2-4c83-9eb4-0696bfb726f2\" width=\"13\" height=\"13\" alt=\"\">\n                    <\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; align-items:flex-start; gap:10px; margin-top:14px; padding:11px 14px; border-radius:8px; background:#FBF0C9\">\n                    <img src=\"f7fd4c33-b1a2-4729-b191-124044b69852\" width=\"16\" height=\"16\" alt=\"\" style=\"flex:0 0 16px; margin-top:1px; filter:invert(36%) sepia(62%) saturate(900%) hue-rotate(20deg) brightness(88%)\">\n                    <span style=\"font:500 13px/145% var(--font-body); color:#0c0c0c\">Post for all milestones to earn {{ rewardNameLower }}.<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:34px minmax(0,1fr); gap:14px; padding:20px clamp(14px,2vw,22px); border-top:1px solid var(--border); background:var(--bg-secondary)\">\n                <div style=\"width:30px; height:30px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center\">\n                  <img src=\"86cd901d-d78b-4c66-9f96-60eb701ea9bd\" width=\"15\" height=\"15\" alt=\"\">\n                <\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <div style=\"font:600 16px/140% var(--font-body)\">Two deadlines per milestone<\u002Fdiv>\n                  <div style=\"font:400 14px/160% var(--font-body); color:var(--fg-secondary); margin-top:6px\">The LinkedIn post link is due 2 days after the project deadline. Both close at 11:59 PM IST and can't be reopened once passed.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ startCurrent }}\" style=\"display:none\">\n              <span>Go to Milestone {{ currentN }}<\u002Fspan>\n              <img src=\"c88a6564-bae2-4c83-9eb4-0696bfb726f2\" width=\"16\" height=\"16\" alt=\"\" style=\"filter:invert(1)\">\n            <\u002Fbutton>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ milestoneOn }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font:400 12px/140% var(--font-body); color:var(--fg-tertiary)\">Milestone {{ sel.n }} of {{ total }}<\u002Fdiv>\n          <div style=\"font:500 clamp(22px,2.6vw,26px)/124% var(--font-body); letter-spacing:-0.5px; margin:4px 0 12px\">{{ sel.title }}<\u002Fdiv>\n          <div style=\"display:inlin
