          <div style=\"font:500 clamp(22px,3vw,28px)/124% var(--font-body); letter-spacing:-0.3px; margin:26px 0 8px\">Great job submitting your Milestone {{ sel.n }} project!<\u002Fdiv>\n          <div style=\"font:400 15px/155% var(--font-body); color:var(--fg-secondary)\">Your certificate is waiting for you in My Certificates.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #0c0c0c; padding:18px; display:flex; justify-content:center\">\n          <button sc-camel-on-click=\"{{ certContinue }}\" style=\"width:{{ certBtnW }}; background:#0c0c0c; color:#fff; border:none; border-radius:8px; padding:14px 26px; font:500 14px/118% var(--font-body); cursor:pointer\">Go to My Certificates<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSample }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:70; background:rgba(203,203,203,0.8); display:flex; align-items:{{ sheetAlign }}; justify-content:center; padding:{{ sheetPad }}\">\n      <div style=\"background:#fff; border:1px solid var(--border); border-radius:{{ sheetRadius }}; width:100%; max-width:600px; max-height:{{ sheetMaxH }}; overflow:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border)\">\n          <div style=\"font:600 16px/140% var(--font-body)\">A sample post<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeSub }}\" style=\"cursor:pointer; padding:4px\"><img src=\"c118ec18-1f0b-42e7-bee1-7a8e1fd9a89d\" width=\"18\" height=\"18\" alt=\"\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:18px clamp(16px,3vw,22px) 22px\">\n          <div style=\"border:1px solid var(--border); border-radius:8px; overflow:hidden\">\n            <div style=\"display:flex; gap:12px; align-items:center; padding:13px 15px\">\n              <div style=\"width:40px; height:40px; border-radius:50%; background:#dfe6e1\"><\u002Fdiv>\n              <div>\n                <div style=\"font:600 14px/130% var(--font-body)\">Past fellow<\u002Fdiv>\n                <div style=\"font:400 12px/140% var(--font-body); color:var(--fg-tertiary)\">PM Fellow at NextLeap<\u002Fdiv>\n              <\u002Fdiv>\n              <img src=\"a61e6c7e-180b-49cd-8f2f-271768ff09c4\" width=\"17\" height=\"17\" alt=\"\" style=\"margin-left:auto; filter:brightness(0); opacity:0.6\">\n            <\u002Fdiv>\n            <div style=\"padding:0 15px 13px\">\n              <p style=\"font-size:14px; line-height:165%; margin:0 0 10px\">One of the most powerful things that can make or break a brand is its users' reviews. Having a good and reliable review system in place for its users is a product's responsibility.<\u002Fp>\n              <p style=\"font-size:14px; line-height:165%; margin:0 0 10px\">You want to buy a dress online, you straight away go down to reviews to check for pictures of how that might look in real life..<\u002Fp>\n              <p style=\"font-size:14px; line-height:165%; margin:0 0 10px\">You want to book a hotel room, you scroll to the bottom to look for the reviews..<\u002Fp>\n              <p style=\"font-size:14px; line-height:165%; margin:0 0 10px\">This search for 'Word of Mouth' applies to almost every aspect of our life. And then there are products which are completely built on the basis of Reviews. One such beautiful product is Tripadvisor.<\u002Fp>\n              <p style=\"font-size:14px; line-height:165%; margin:0 0 10px\">Below is my take on product teardown of writing a review process in Tripadvisor, as a part of <strong>@NextLeap<\u002Fstrong> LIP 2/{{ total }} challenge.<\u002Fp>\n              <p style=\"font-size:14px; line-height:165%; margin:0; color:#0a66c2\">#nextleap #productmanagement #tripadvisor #nextleappmfellowship #reviewsmatter<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"height:120px; background:#eef1ef; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:center; font:400 12px/140% var(--font-body); color:var(--fg-tertiary)\">[ your project deck or carousel ]<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:8px; margin-top:16px\">\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"adfa5a0a-5736-406f-ad1b-2246076500c8\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.7; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">“PM Fellow at NextLeap” on your profile<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"97fadaa4-3b42-4803-9d5e-614bc91adffa\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.7; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">The post number, e.g. <strong>2/{{ total }}<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"6fddb811-d8c6-4634-9089-3c6ea3cff7f6\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.7; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">Tag <strong>@NextLeap<\u002Fstrong> and use <strong>#NextLeapPMFellowship<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showDetails }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:70; background:rgba(203,203,203,0.8); display:flex; align-items:{{ sheetAlign }}; justify-content:center; padding:{{ sheetPad }}\">\n      <div style=\"background:#fff; border:1px solid var(--border); border-radius:{{ sheetRadius }}; width:100%; max-width:580px; max-height:{{ sheetMaxH }}; overflow:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border)\">\n          <div style=\"font:600 16px/140% var(--font-body)\">Learn in Public: details &amp; policy<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeSub }}\" style=\"cursor:pointer; padding:4px\"><img src=\"c118ec18-1f0b-42e7-bee1-7a8e1fd9a89d\" width=\"18\" height=\"18\" alt=\"\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px clamp(16px,3vw,22px) 24px\">\n          <div style=\"display:flex; align-items:flex-start; gap:11px; border:1px solid var(--border); border-radius:8px; padding:13px 15px; background:var(--bg-secondary)\">\n            <img src=\"81fcf56b-0ce0-4639-a9e6-fcd1114207bc\" width=\"17\" height=\"17\" alt=\"\" style=\"opacity:0.6; margin-top:2px\">\n            <div style=\"font:400 14px/155% var(--font-body); color:var(--fg-secondary)\">Optional. One post per milestone project, {{ total }} in total. Skipping it doesn't affect your weekly rewards, fellowship completion or placements — it builds your portfolio and personal brand.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 14px/140% var(--font-body); margin:22px 0 10px\">For a post to count<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px\">\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"4a3904d5-6f8d-4ca3-849c-5c510c19583d\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.6; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">“PM Fellow at NextLeap” on your LinkedIn profile<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"4a3904d5-6f8d-4ca3-849c-5c510c19583d\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.6; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">The post number in the copy, e.g. 1/{{ total }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"4a3904d5-6f8d-4ca3-849c-5c510c19583d\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.6; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">Tag @NextLeap and use #NextLeapPMFellowship<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"4a3904d5-6f8d-4ca3-849c-5c510c19583d\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.6; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">Link submitted here before the post deadline shown on the milestone<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 14px/140% var(--font-body); margin:22px 0 10px\">Quality standard<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px\">\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"c118ec18-1f0b-42e7-bee1-7a8e1fd9a89d\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.6; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">No copy-paste from NextLeap material or other sources — credit anything you cite. Plagiarised posts are disqualified and community privileges revoked.<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-start\"><img src=\"c118ec18-1f0b-42e7-bee1-7a8e1fd9a89d\" width=\"15\" height=\"15\" alt=\"\" style=\"opacity:0.6; margin-top:3px\"><div style=\"font:400 14px/150% var(--font-body)\">Inappropriate, unprofessional or disrespectful posts can be disqualified at NextLeap's discretion.<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 14px/140% var(--font-body); margin:22px 0 10px\">What makes a post land<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px\">\n            <div style=\"font:400 14px/150% var(--font-body)\"><strong>Write for your reader.<\u002Fstrong> Simplify with relatable examples.<\u002Fdiv>\n            <div style=\"font:400 14px/150% var(--font-body)\"><strong>Start a conversation.<\u002Fstrong> Give people something to think about.<\u002Fdiv>\n            <div style=\"font:400 14px/150% var(--font-body)\"><strong>Be authentic.<\u002Fstrong> Real curiosity attracts the right people.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showReward }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:70; background:rgba(203,203,203,0.8); display:flex; align-items:{{ sheetAlign }}; justify-content:center; padding:{{ sheetPad }}\">\n      <div style=\"background:#fff; border:1px solid var(--border); border-radius:{{ sheetRadius }}; width:100%; max-width:460px; max-height:{{ sheetMaxH }}; overflow:auto\">\n        <div style=\"display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border)\">\n          <div style=\"font:600 16px/140% var(--font-body)\">Reward<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeSub }}\" style=\"cursor:pointer; padding:4px\"><img src=\"c118ec18-1f0b-42e7-bee1-7a8e1fd9a89d\" width=\"18\" height=\"18\" alt=\"\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:20px clamp(16px,3vw,22px) 24px\">\n          <div style=\"background:#FBF0C9; border:1px solid #EFD98A; border-radius:8px; padding:20px\">\n            <div style=\"width:40px; height:40px; border-radius:8px; background:#fff; border:1px solid #E6CB6E; display:flex; align-items:center; justify-content:center; margin-bottom:14px\">\n              <img src=\"f7fd4c33-b1a2-4729-b191-124044b69852\" width=\"20\" height=\"20\" alt=\"\" style=\"filter:invert(36%) sepia(62%) saturate(900%) hue-rotate(20deg) brightness(88%)\">\n            <\u002Fdiv>\n            <div style=\"font:600 19px/128% var(--font-body); letter-spacing:-0.2px; color:#0c0c0c\">{{ rewardName }}<\u002Fdiv>\n            <div style=\"display:flex; gap:9px; align-items:flex-start; margin-top:10px\">\n              <img src=\"4a3904d5-6f8d-4ca3-849c-5c510c19583d\" width=\"15\" height=\"15\" alt=\"\" style=\"margin-top:3px; filter:invert(36%) sepia(62%) saturate(900%) hue-rotate(20deg) brightness(88%)\">\n              <div style=\"font:400 14px/155% var(--font-body); color:#7A5A00\">{{ rewardDetail }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:16px\">\n            <div style=\"display:flex; gap:4px\">\n              <sc-for list=\"{{ postPips }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <div style=\"width:26px; height:6px; border-radius:100px; background:{{ p.bg }}\"><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font:400 13px/140% var(--font-body); color:var(--fg-secondary)\">{{ postsLine }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:400 14px/155% var(--font-body); color:var(--fg-secondary); margin-top:14px\">Unlocks once you've shared a post for all {{ total }} milestones, each before its deadline. A single post doesn't unlock it on its own.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;program&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;PMF&quot;,&quot;AGB&quot;],&quot;default&quot;:&quot;PMF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Fellowship&quot;}}\">\nconst MS = [\n  { n: 1, title: \"Systems Thinking & Mapping Outcomes\", short: \"Systems thinking\", sub: \"Understand the market landscape, the goals and how to map business and product outcomes\", due: \"Aug 14\", lipDue: \"Aug 16\", project: \"done\", post: \"done\", file: \"Mile1_Systems_Thinking.pdf\", url: \"linkedin.com/posts/anushka-shukla_lip-1-5\",\n    intro: [\"You've joined the ChatGPT India mobile team. Your manager wants to increase usage of voice input on the app, which very few users in India use today.\", \"Your first task is to understand the landscape and figure out why.\"],\n    tasks: [\"Understand voice usage trends in India across apps like Google Assistant, WhatsApp voice notes and Alexa\", \"Analyse where voice input is surfaced in ChatGPT mobile, and whether it is discoverable and helpful\", \"Evaluate 2-3 competing or analogous products and how they integrate voice\", \"Outline why more voice usage could be valuable, and the product outcomes it could drive\"],\n    deckIntro: \"You need to submit a 3-slide deck:\",\n    slides: [{ k: \"Slide 1:\", v: \"Market and user context for voice input in India\" }, { k: \"Slide 2:\", v: \"Teardown of the current ChatGPT voice experience\" }, { k: \"Slide 3:\", v: \"Outcomes you would target, with a metric for each\" }] },\n  { n: 2, title: \"User Research & Problem Framing\", short: \"User research\", sub: \"Segment users, carry out user research and derive insights to frame the problem\", due: \"Aug 28\", lipDue: \"Aug 30\", project: \"done\", post: \"done\", file: \"Mile2_User_Research.pdf\", url: \"linkedin.com/posts/anushka-shukla_lip-2-5\",\n    intro: [\"Your manager is happy with your market understanding and wants you to go deeper.\", \"Your task over the next 2 weeks is to understand why users are not using voice input on ChatGPT mobile, especially in India.\"],\n    tasks: [\"Lay out 4-5 user segments who are likely to use ChatGPT mobile (e.g. students, job seekers, content creators, regional language users)\", \"Choose one user segment to focus on — ideally the one with the highest potential impact\", \"Write down hypotheses on why this segment is not using voice input\", \"Design a short survey and collect 30+ responses from that segment\", \"Talk to 5-6 users in that segment to understand real behaviour, anxieties and mental models\", \"Based on the insights, fill in the Problem Framing Canvas to clearly define the real barrier to voice usage\"],\n    deckIntro: \"You need to submit a 3-slide deck:\",\n    slides: [{ k: \"Slide 1:\", v: \"Chosen segment and justification of impact\" }, { k: \"Slide 2:\", v: \"Insights from user research (quantitative and qualitative) — pain points, blockers\" }, { k: \"Slide 3:\", v: \"Problem Framing Canvas\" }] },\n  { n: 3, title: \"Prioritisation, Metrics & Growth\", short: \"Prioritisation\", sub: \"Prioritise solutions, build wireframes and outline metrics and growth strategies\", due: \"Sep 11\", lipDue: \"Sep 13\", file: \"Mile3_Prioritisation_Metrics.pdf\", url: \"linkedin.com/posts/anushka-shukla_lip-3-5\",\n    intro: [\"You've framed the real barrier to voice usage. Your manager now wants a plan: what to build first, what it looks like, and how you'll know it worked.\", \"Your task over the next 2 weeks is to go from problem to a prioritised, measurable solution for your chosen segment.\"],\n    tasks: [\"Generate at least 8 solution ideas that address the barrier you framed in Milestone 2\", \"Prioritise them using a stated framework (RICE, impact vs effort, or your own) and show your scores\", \"Pick one solution and explain the trade-offs you made to choose it\", \"Wireframe the core flow of that solution — low fidelity is fine\", \"Define a north-star metric, 2-3 supporting metrics and one counter metric\", \"Outline one growth loop that could drive repeat voice usage\"],\n    deckIntro: \"You need to submit a 3-slide deck:\",\n    slides: [{ k: \"Slide 1:\", v: \"Prioritisation with scores and the framework you used\" }, { k: \"Slide 2:\", v: \"Wireframes of the solution you picked\" }, { k: \"Slide 3:\", v: \"Metric tree and growth loop\" }] },\n  { n: 4, title: \"AI System Design, LLMs & Prompt Engineering\", short: \"AI system design\", sub: \"Design a retrieval-based assistant, write the prompts and ship a working prototype\", due: \"Oct 2\", lipDue: \"Oct 4\", project: \"upcoming\", post: \"locked\", file: \"Upload your PDF file\", url: \"\",\n    intro: [\"Build a small facts-only FAQ assistant that answers questions about mutual fund schemes using only official AMC, SEBI and AMFI pages.\", \"Every answer must cite one source link. No investment advice.\"],\n    tasks: [\"Pick one product: INDMoney, Groww, PowerUp Money, Wealth Monitor or Kuvera\", \"Collect 15-25 official source URLs for the schemes in scope\", \"Build a retrieval-based assistant that answers in 3 sentences or fewer\", \"Add safe refusals for advice, performance claims and personal data\"],\n    deckIntro: \"You need to submit:\",\n    slides: [{ k: \"Prototype:\", v: \"Working link, or a 3-minute demo video\" }, { k: \"Sources:\", v: \"The list of URLs you used\" }, { k: \"Sample Q&A:\", v: \"5-10 queries with answers and links\" }] }\n];\nconst TOTAL = MS.length;\nconst PDF = (name) => ({ type: \"file\", label: \"Upload your file (PDF)\", short: \"PDF\", required: true, value: name });\nconst FIELDS = {\n  1: [PDF(\"Mile1_Systems_Thinking.pdf\")],\n  2: [PDF(\"Mile2_User_Research.pdf\")],\n  3: [PDF(\"Mile3_Prioritisation_Metrics.pdf\"),\n      { type: \"link\", label: \"Link of your prototype\", short: \"Prototype\", required: false, placeholder: \"https://\", value: \"figma.com/proto/voice-mic-entry\" }],\n  4: [{ type: \"link\", label: \"Share GitHub link\", short: \"GitHub\", required: true, hint: \"Add source list, sample Q&A and disclaimer in your README.md\", placeholder: \"https://github.com/...\", value: \"github.com/anushka/mf-faq-assistant\" },\n      { type: \"link\", label: \"Share a working prototype link\", short: \"Prototype\", required: true, hint: \"Can be a hosting link of a notebook or app\", placeholder: \"https://\", value: \"mf-faq.streamlit.app\" },\n      { type: \"link\", label: \"Google Drive link of demo video (3 min or less)\", short: \"Demo video\", required: false, hint: \"Only if a working prototype link isn't available. Give view access to everyone.\", placeholder: \"https://drive.google.com/...\", value: \"\" }]\n};\nconst TINT = {\n  green: \"color-mix(in oklch, var(--brand-green) 16%, #fff)\",\n  yellow: \"color-mix(in oklch, var(--tag-yellow) 48%, #fff)\",\n  red: \"color-mix(in oklch, var(--c-red) 16%, #fff)\",\n  grey: \"#f1f1f1\"\n};\nconst PROJECT_TAG = { done: { label: \"Completed\", bg: TINT.green }, pending: { label: \"Pending\", bg: TINT.yellow }, upcoming: { label: \"Pending\", bg: TINT.grey } };\nconst POST_TAG = { done: { label: \"Posted\", bg: TINT.green }, pending: { label: \"Pending\", bg: TINT.yellow }, missed: { label: \"Deadline passed\", bg: TINT.red }, locked: { label: \"Pending\", bg: TINT.yellow, _x: TINT.grey } };\nconst STATES = [\n  { id: \"intro\", label: \"First visit · intro\" },\n  { id: \"todo\", label: \"Step 1 · submit project\" },\n  { id: \"cert\", label: \"Certificate popup\" },\n  { id: \"open\", label: \"Step 2 · share post\" },\n  { id: \"done\", label: \"Both steps done\" },\n  { id: \"missed\", label: \"Post deadline missed\" }\n];\n\nclass Component extends DCLogic {\n  state = { w: typeof window !== \"undefined\" ? window.innerWidth : 1280, m3: \"todo\", sel: -1, intro: true, introStep: 0, modal: null, sub: null, url: \"\", hl: false, demo: \"intro\", subVisible: false };\n  step2Ref = React.createRef();\n  subRef = React.createRef();\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener(\"resize\", this.onResize);\n    this.onScroll = () => {\n      const el = this.subRef.current;\n      if (!el) return;\n      const visible = el.getBoundingClientRect().top < window.innerHeight - 120;\n      if (visible !== this.state.subVisible) this.setState({ subVisible: visible });\n    };\n    window.addEventListener(\"scroll\", this.onScroll, { passive: true });\n    setTimeout(this.onScroll, 100);\n  }\n  componentDidUpdate(prevProps, prevState) {\n    if (prevState.sel !== this.state.sel || prevState.w !== this.state.w) setTimeout(this.onScroll, 50);\n  }\n  goSub() {\n    const el = this.subRef.current;\n    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: \"smooth\" });\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this.onResize);\n    window.removeEventListener(\"scroll\", this.onScroll);\n    clearTimeout(this.hlTimer);\n  }\n\n  setDemo(id) {\n    const base = { demo: id, sel: 2, modal: null, sub: null, intro: false, hl: false };\n    if (id === \"intro\") this.setState({ ...base, sel: -1, m3: \"todo\" });\n    else if (id === \"todo\") this.setState({ ...base, m3: \"todo\" });\n    else if (id === \"cert\") this.setState({ ...base, m3: \"open\", modal: \"cert\" });\n    else if (id === \"open\") this.setState({ ...base, m3: \"open\" });\n    else this.setState({ ...base, m3: id });\n  }\n\n  focusStep2() {\n    this.setState({ modal: null, hl: true, sel: 2, demo: \"open\" });\n    setTimeout(() => {\n      const el = this.step2Ref.current;\n      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: \"smooth\" });\n    }, 60);\n    clearTimeout(this.hlTimer);\n    this.hlTimer = setTimeout(() => this.setState({ hl: false }), 3200);\n  }\n\n  renderVals() {\n    const { w, m3, intro, introStep, modal, sub } = this.state;\n    const narrow = w < 900;\n    const noSide = w < 1140;\n    const program = this.props.program ?? \"PMF\";\n\n    const ms = MS.map((m) => {\n      if (m.n !== 3) return m;\n      return { ...m, project: m3 === \"todo\" ? \"pending\" : \"done\", post: m3 === \"todo\" || m3 === \"open\" ? \"pending\" : m3 };\n    });\n    const selIdx = this.state.sel;\n    const guideOn = selIdx === -1;\n    const cur = ms[guideOn ? 2 : selIdx];\n    const postsDone = ms.filter((m) => m.post === \"done\").length;\n    const anyMissed = ms.some((m) => m.post === \"missed\");\n\n    const s1done = cur.project === \"done\";\n    const p = cur.post;\n    const hl = this.state.hl && p === \"pending\";\n\n    const introPips = [0, 1, 2, 3].map((i) => ({ bg: i <= introStep ? \"#0c0c0c\" : \"#e2e4e2\" }));\n    const kickers = [\"Milestones\", \"Learn in Public\", \"Learn in Public\", \"Reward\"];\n\n    return {\n      sideDisplay: noSide ? \"none\" : \"flex\",\n      topbarDisplay: noSide ? \"flex\" : \"none\",\n      bodyDir: narrow ? \"column\" : \"row\",\n      railFlex: narrow ? \"0 0 auto\" : \"0 0 clamp(270px, 30%, 380px)\",\n      railBorderR: narrow ? \"none\" : \"1px solid var(--border)\",\n      railBorderB: narrow ? \"1px solid var(--border)\" : \"none\",\n      railPad: narrow ? \"16px 16px 12px\" : \"26px 22px 40px\",\n      railDir: narrow ? \"row\" : \"column\",\n      railGap: narrow ? \"12px\" : \"0px\",\n      railOverflow: narrow ? \"auto\" : \"visible\",\n      railCols: narrow ? \"minmax(0,1fr)\" : \"30px minmax(0,1fr)\",\n      numDisplay: narrow ? \"none\" : \"flex\",\n      cardFlex: narrow ? \"0 0 min(280px, 82vw)\" : \"0 0 auto\",\n      sheetAlign: w < 600 ? \"flex-end\" : \"center\",\n      sheetPad: w < 600 ? \"0px\" : \"16px\",\n      sheetRadius: w < 600 ? \"16px 16px 0 0\" : \"12px\",\n      sheetMaxH: w < 600 ? \"88vh\" : \"calc(100vh - 32px)\",\n      certPad: w < 600 ? \"54px 18px 20px\" : \"32px 40px 22px\",\n      certBtnW: w < 600 ? \"100%\" : \"auto\",\n      statesWrap: w < 600 ? \"nowrap\" : \"wrap\",\n      btnFlex: w < 600 ? \"1 1 100%\" : \"0 0 auto\",\n      cardMb: narrow ? \"0px\" : \"18px\",\n\n      rail: STATES.map((x) => {\n        const on = this.state.demo === x.id;\n        return { label: x.label, bg: on ? \"#0d3f27\" : \"#fff\", fg: on ? \"#fff\" : \"rgba(0,0,0,0.75)\", bd: on ? \"#0d3f27\" : \"#E5E5E5\", go: () => this.setDemo(x.id) };\n      }),\n\n      total: TOTAL,\n      guideOn, milestoneOn: !guideOn, currentN: 3,\n      startCurrent: () => { this.setState({ sel: 2, demo: this.state.demo === \"intro\" ? \"todo\" : this.state.demo }); window.scrollTo({ top: 0 }); },\n      g: { hdrBg: guideOn ? \"#0d3f27\" : \"#f1f1f1\", hdrFg: guideOn ? \"#f st: true, isDone: false, icon: \"#8a8a8a\", title: \"Learn in Public deadline passed : \" + cur.lipDue, sub: \"Project submitted · post link not submitted\" }\n            : { isProject: false, isPost: true, isDone: false, icon: \"#E0383E\", title: \"Learn in Public challenge due by : \" + cur.lipDue + \", 11:59 PM IST\", sub: \"Step 2 of 2 · Project submitted, share it on LinkedIn\" } };\n      })(),\n      ms: ms.map((m, i) => {\n        const on = i === selIdx;\n        return {\n          n: m.n, title: m.title, sub: m.sub,\n          pTag: PROJECT_TAG[m.project], lTag: POST_TAG[m.post],\n          due: m.due, lipDue: m.lipDue,\n          pTag2: m.project === \"done\" ? { label: \"Completed\", bg: TINT.green } : { label: \"Pending\", bg: TINT.grey },\n          lTag2: m.post === \"done\" ? { label: \"Completed\", bg: TINT.green } : m.post === \"missed\" ? { label: \"Missed\", bg: TINT.red } : { label: \"Pending\", bg: TINT.grey },\n          tag: m.project !== \"done\" ? { label: \"Pending\", bg: TINT.grey }\n            : m.post === \"done\" ? { label: \"Completed\", bg: TINT.green }\n            : m.post === \"missed\" ? { label: \"Post missed\", bg: TINT.red }\n            : { label: \"Pending\", bg: TINT.grey },\n          hdrBg: on ? \"#0d3f27\" : TINT.green, hdrFg: on ? \"#fff\" : \"rgba(0,0,0,0.78)\",\n          cardBd: on ? \"#0d3f27\" : \"#E5E5E5\",\n          numBg: on ? \"#0d3f27\" : TINT.green, numFg: on ? \"#fff\" : \"rgba(0,0,0,0.78)\",\n          lineDisplay: i === ms.length - 1 ? \"none\" : \"block\",\n          select: () => this.setState({ sel: i, hl: false })\n        };\n      }),\n\n      sel: (() => {\n        const raw = FIELDS[cur.n] || [];\n        const fields = raw\n          .filter((f) => !(cur.project === \"done\" && !f.value))\n          .map((f) => ({\n            label: f.label, short: f.short, hint: f.hint || \"\", hasHint: !!f.hint,\n            isFile: f.type === \"file\", isLink: f.type === \"link\",\n            placeholder: f.placeholder || \"\",\n            reqLabel: f.required ? \"Required\" : \"Optional\",\n            reqFg: f.required ? \"#c0392b\" : \"var(--fg-tertiary)\",\n            value: f.value || \"—\",\n            doneIcon: f.type === \"file\" ? \"https://unpkg.com/lucide-static@latest/icons/file-text.svg\" : \"https://unpkg.com/lucide-static@latest/icons/link.svg\"\n          }));\n        const req = raw.filter((f) => f.required).length;\n        const fieldsNote = raw.length === 1 ? \"One file, as described in the brief.\" : raw.length + \" fields · \" + req + \" required\";\n        return { ...cur, pTag: PROJECT_TAG[cur.project], lTag: POST_TAG[cur.post], fields, fieldsNote };\n      })(),\n      dl: (() => {\n        const stepsDone = (cur.project === \"done\" ? 1 : 0) + (p === \"done\" ? 1 : 0);\n        const flags = { isMissed: p === \"missed\", isDone: p !== \"missed\" && stepsDone === 2, isOpen: p !== \"missed\" && stepsDone < 2 };\n        if (p === \"missed\") return { ...flags, iconBg: \"#ff3b30\", icon: \"https://unpkg.com/lucide-static@latest/icons/calendar-x.svg\", note: \"Deadline passed · project submitted, LinkedIn post not submitted\", cta: \"View submission\" };\n        if (stepsDone === 2) return { ...flags, iconBg: \"#21c45b\", icon: \"https://unpkg.com/lucide-static@latest/icons/check.svg\", note: \"Both steps done · project and LinkedIn post submitted\", cta: \"View submission\" };\n        return { ...flags, iconBg: \"#ff3b30\", icon: \"https://unpkg.com/lucide-static@latest/icons/calendar-clock.svg\", note: stepsDone + \" of 2 steps done · project and LinkedIn post share this deadline\", cta: \"Go to submission\" };\n      })(),\n      s1: { done: s1done, notDone: !s1done, circleBg: s1done ? \"#21c45b\" : \"#0c0c0c\" },\n      s2: {\n        locked: false, open: p === \"pending\" || p === \"locked\", done: p === \"done\", missed: p === \"missed\",\n        showNum: p !== \"done\", showDeadline: p === \"pending\" || p === \"done\",\n        circleBg: p === \"done\" ? \"#21c45b\" : p === \"pending\" || p === \"locked\" ? \"#0c0c0c\" : p === \"missed\" ? TINT.red : \"#f1f1f1\",\n        circleFg: p === \"pending\" || p === \"locked\" ? \"#fff\" : \"rgba(0,0,0,0.5)\",\n        titleFg: \"rgba(0,0,0,0.92)\",\n        rowBg: hl ? \"color-mix(in oklch, var(--brand-green) 8%, #fff)\" : \"#fff\",\n        ring: hl ? \"inset 0 0 0 2px #21c45b\" : \"none\"\n      },\n      step2Ref: this.step2Ref,\n      subRef: this.subRef,\n      goSubmission: () => this.goSub(),\n      showSticky: false,\n      stickyLabel: cur.project !== \"done\" ? \"Submit project\" : \"Share post\",\n\n      postPips: ms.map((m) => ({ bg: m.post === \"done\" ? \"#21c45b\" : m.post === \"missed\" ? \"#f2b8b5\" : m.post === \"pending\" ? \"#0c0c0c\" : \"#e2e4e2\" })),\n      postsLine: anyMissed ? postsDone + \" of \" + TOTAL + \" posts · reward locked\" : postsDone + \" of \" + TOTAL + \" posts shared\",\n\n      submitProject: () => this.setState({ m3: \"open\", modal: \"cert\", demo: \"cert\" }),\n      certContinue: () => this.focusStep2(),\n      submitPost: () => this.setState({ m3: \"done\", demo: \"done\", hl: false }),\n      url: this.state.url,\n      onUrl: (e) => this.setState({ url: e.target.value, hl: false }),\n\n      showIntro: intro,\n      i0: introStep === 0, i1: introStep === 1, i2: introStep === 2, i3: introStep === 3,\n      introPips, introKicker: kickers[introStep],\n      introMs: MS.map((m) => ({ n: m.n, short: m.short })),\n      introHasBack: introStep > 0,\n      introNextLabel: introStep === 3 ? \"Show me my milestones\" : \"Next\",\n      introNext: () => introStep >= 3 ? this.setState({ intro: false, introStep: 0, demo: \"todo\" }) : this.setState({ introStep: introStep + 1 }),\n      introBack: () => this.setState({ introStep: Math.max(0, introStep - 1) }),\n      openIntro: () => this.setState({ intro: !intro }),\n      closeIntro: () => this.setState({ intro: false, demo: this.state.demo === \"intro\" ? \"todo\" : this.state.demo }),\n\n      showCert: modal === \"cert\",\n      showSample: sub === \"sample\", showDetails: sub === \"details\", showReward: sub === \"reward\",\n      openSample: () => this.setState({ sub: \"sample\", hl: false }),\n      openDetails: () => this.setState({ sub: \"details\", hl: false }),\n      openReward: () => this.setState({ sub: \"reward\", hl: false }),\n      closeSub: () => this.setState({ sub: null }),\n\n      rewardNameLower: program === \"AGB\" ? \"a place in the exclusive jobs community\" : \"1 extra graduation project attempt\",\n      rewardName: program === \"AGB\" ? \"A place in the exclusive jobs community\" : \"1 extra graduation project attempt\",\n      rewardDetail: program === \"AGB\"\n        ? \"A private community where partner companies share roles and hire directly from NextLeap fellows.\"\n        : \"One more shot at the graduation project, in case you need it. Nothing else in the fellowship changes either way.\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
